plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group
base { archivesName = 'aftrhrs' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
    maven { name = 'JEI'; url = 'https://maven.blamejared.com/' }
}

// Game tests: a separate dev-only mod (src/gametest, mod id aftrhrs_gametest), never in the release jar.
sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        aftrhrs {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        aftrhrs_gametest {
            sourceSet sourceSets.gametest
        }
    }
    accessWidenerPath = file('src/main/resources/aftrhrs.classtweaker')
    runs {
        client {
            client()
            runDir('run')
            programArgs '--username', 'Kev'
            if (project.hasProperty('join')) programArgs '--quickPlayMultiplayer', project.property('join')
        }
        server {
            server()
            runDir('run-server')
        }
        // ./gradlew runGametest: a headless server that runs every @GameTest and exits (report in build/gametest-report.xml).
        gametest {
            server()
            name 'Game Test'
            source sourceSets.gametest
            runDir('build/gametest')
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-report.xml"
            // Apply every mixin at startup: a broken injection fails the run instead of crashing in play.
            vmArg '-Dmixin.debug.verify=true'
            // The Arcana creature spawner's timer stays off: its creatures would wander into other tests (the spawn
            // tests call ArcanaSpawner.probe directly).
            vmArg '-Daftrhrs.spawner.paused=true'
        }
        // ./gradlew runSoak: a dev server with the soak driver (/soak ... console commands, gametest/soak/SoakDriver).
        soak {
            server()
            name 'Soak'
            source sourceSets.gametest
            runDir(project.findProperty('soakDir') ?: 'run-soak')   // -PsoakDir=run-mig/x for migration runs
            vmArg '-Daftrhrs.soak=true'
            vmArg '-Xmx6G'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "maven.modrinth:geckolib:${geckolib_modrinth_id}"

    // Bundled libraries (jar-in-jar): YAML for Feather-compatible configs and data, Adventure + MiniMessage for
    // Feather's message format (converted to vanilla components at the boundary).
    implementation include("org.yaml:snakeyaml:${snakeyaml_version}")
    ['adventure-api', 'adventure-key', 'adventure-text-minimessage', 'adventure-text-serializer-gson',
     'adventure-text-serializer-json', 'adventure-text-serializer-plain', 'adventure-text-serializer-legacy',
     'adventure-text-serializer-commons', 'adventure-nbt'].each {
        implementation include("net.kyori:${it}:${adventure_version}")
    }
    implementation include("net.kyori:examination-api:1.3.0")
    implementation include("net.kyori:examination-string:1.3.0")
    implementation include("net.kyori:option:1.1.0")
    implementation include("me.lucko:fabric-permissions-api:${permissions_api_version}")
    compileOnly "net.luckperms:api:${luckperms_api_version}"

    compileOnly "mezz.jei:jei-26.3-fabric-api:${jei_version}"
    compileOnly "mezz.jei:jei-26.3-common-api:${jei_version}"
    if (project.hasProperty('withJei')) localRuntime "mezz.jei:jei-26.3-fabric:${jei_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(java_version)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

// Every assets/aftrhrs/lang/en_us.<part>.json (content, entities, client...) is folded into en_us.json at build time,
// so each area owns its own lang file and merges never conflict.
processResources {
    doLast {
        def langDir = file("${destinationDir}/assets/aftrhrs/lang")
        if (!langDir.exists()) return
        def slurper = new groovy.json.JsonSlurper()
        def merged = new TreeMap()
        def main = new File(langDir, 'en_us.json')
        langDir.listFiles().findAll { it.name ==~ /en_us\..+\.json/ }.sort { it.name }.each {
            merged.putAll(slurper.parse(it, 'UTF-8'))
            it.delete()
        }
        if (main.exists()) merged.putAll(slurper.parse(main, 'UTF-8'))
        main.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)), 'UTF-8')
    }
}
