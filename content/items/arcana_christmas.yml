# Aftr Hrs Christmas set: trees, ornaments, decorations, presents and festive blocks.
# Generated by mod/tools/xmasart/gen.py (edit the generator, not this file); read by tools/gen_content.py.
# Behavior (fir tree ornaments, presents, snow globe, advent wreath, mistletoe): feature/christmas.

arcana_christmas_tree:
  itemname: "Christmas Tree"
  material: PAPER
  lore:
  - "<gray>A tall fir hung with baubles,"
  - "<gray>tinsel and twinkling lights."
  - "<dark_gray>Right-click to switch the lights"
  pack:
    generate_model: false
    model: arcana/christmas/christmas_tree
  mechanics:
    furniture:
      type: DISPLAY_ENTITY
      properties:
        display_transform: NONE
        scale: { x: 2.0, y: 2.0, z: 2.0 }
      barriers:
      - origin
      - {y: 1}
      - {y: 2}
      lights:
      - 0,0,0 10
      - 0,1,0 10
      - 0,2,0 10
      rotatable: true
      restricted_rotation: VERY_STRICT
      limited_placing:
        floor: true
        wall: false
        roof: false
      block_sounds:
        place: { sound: block.azalea_leaves.place, volume: 1.0, pitch: 1.0 }
        break: { sound: block.azalea_leaves.break, volume: 1.0, pitch: 1.0 }
        hit: { sound: block.azalea_leaves.hit, volume: 0.5, pitch: 1.0 }
        step: { sound: block.azalea_leaves.step, volume: 0.3, pitch: 1.0 }
        fall: { sound: block.azalea_leaves.fall, volume: 0.5, pitch: 1.0 }
      drop:
        silktouch: false
        loots:
        - { oraxen_item: arcana_christmas_tree, probability: 1.0 }

