# Olive's plushie (built by arcana_items/plushies/work_v2, spec olive.py, build.py olive --no-pack; model + texture
# copied into mod/content/pack). Read by tools/gen_content.py (--content).
arcana_plush_olive:
  itemname: "<gold>Olive Plush"
  material: PAPER
  lore:
  - "<gray>A soft keepsake of Olive, belly up and wall-eyed, purr not included."
  - "<gray>Place it on the floor to show it off."
  components:
    max_stack_size: 16
  pack:
    generate_model: false
    model: arcana/plushies/arcana_plush_olive
  mechanics:
    furniture:
      type: DISPLAY_ENTITY
      hitboxes:
      - 0,0,0 0.4,0.5
      rotatable: true
      restricted_rotation: NONE
      limited_placing:
        floor: true
        wall: false
        roof: false
      properties:
        display_transform: NONE
        scale:
          x: 0.2857
          y: 0.2857
          z: 0.2857
        translation:
          x: 0.0
          y: -0.25
          z: 0.0
        shadow_radius: 0.25
        shadow_strength: 0.6
      drop:
        silktouch: false
        loots:
        - oraxen_item: arcana_plush_olive
          probability: 1.0
