    generate_model: false
    model: arcana/blocks/sets/polished_snow
  mechanics:
    block:
      type: FULL
      map_color: snow
      appearance:
        model: arcana/blocks/sets/polished_snow
      block_sounds:
        place: {sound: block.snow.place, volume: 1.0, pitch: 1.0}
        break: {sound: block.snow.break, volume: 1.0, pitch: 1.0}
        hit: {sound: block.snow.hit, volume: 1.0, pitch: 1.0}
        step: {sound: block.snow.step, volume: 1.0, pitch: 1.0}
        fall: {sound: block.snow.fall, volume: 1.0, pitch: 1.0}
