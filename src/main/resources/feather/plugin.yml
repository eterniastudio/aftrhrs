name: Feather
version: 1.0.0
main: net.axther.feather.Feather
api-version: "1.21"
description: Aftr Hrs server core - teleport requests, homes, hats and nicknames with native menus, plus the Arcana taming guide, Arcana item behavior and the ModelEngine/Oraxen pack bridge.
softdepend: [Essentials, EssentialsChat, Oraxen, MythicMobs, ModelEngine, LuckPerms, PlaceholderAPI]
commands:
  feather:
    description: Open the Feather menu (or /feather reload, /feather update for the server updater).
    usage: /feather [reload|update [status|check|stage|cancel]]
    aliases: [menu, arcanatools]
  tpa:
    description: Ask to teleport to a player (no name opens the player picker).
    usage: /tpa [player]
    aliases: [tpask, call]
    permission: feather.tpa
  tpahere:
    description: Ask a player to teleport to you.
    usage: /tpahere <player>
    aliases: [tpaskhere]
    permission: feather.tpahere
  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept [player]
    aliases: [tpyes]
    permission: feather.tpaccept
  tpdeny:
    description: Deny a teleport request.
    usage: /tpdeny [player]
    aliases: [tpno]
    permission: feather.tpaccept
  tpacancel:
    description: Cancel your outgoing teleport request(s).
    usage: /tpacancel [player]
    aliases: [tpcancel]
    permission: feather.tpa
  tptoggle:
    description: Turn incoming teleport requests on or off.
    usage: /tptoggle
    permission: feather.tptoggle
  home:
    description: Teleport home (no name opens your homes).
    usage: /home [name]
    permission: feather.home
  homes:
    description: Open your homes.
    usage: /homes
    aliases: [listhomes]
    permission: feather.home
  sethome:
    description: Save a home where you stand.
    usage: /sethome [name]
    aliases: [createhome]
    permission: feather.sethome
  delhome:
    description: Delete a home.
    usage: /delhome <name>
    aliases: [deletehome, remhome, rmhome]
    permission: feather.sethome
  homeicon:
    description: Set a home's icon (the item in your hand, a named item, or clear).
    usage: /homeicon <home> [item|clear]
    permission: feather.sethome
  hat:
    description: Wear the item in your hand (/hat off to take it off).
    usage: /hat [off]
    aliases: [head]
    permission: feather.hat
  nick:
    description: Set your nickname (no name opens the editor).
    usage: /nick [nickname|off] or /nick <player> <nickname|off>
    aliases: [nickname]
    permission: feather.nick
  codex:
    description: Open the creature codex (every Arcana creature, how to tame it, where it lives; the old taming guide).
    usage: /codex [category|creature|book]
    aliases: [tamingguide, taming, arcanaguide, creatures]
    permission: feather.guide
  spawn:
    description: Teleport to spawn.
    usage: /spawn [player]
    permission: feather.spawn
  setspawn:
    description: Set the spawn point here.
    usage: /setspawn
    permission: feather.setspawn
  warp:
    description: Warp somewhere (no name opens the list).
    usage: /warp [name]
    aliases: [warps]
    permission: feather.warp
  setwarp:
    description: Create or move a warp here.
    usage: /setwarp <name>
    aliases: [createwarp]
    permission: feather.setwarp
  warpicon:
    description: Set a warp's icon (the item in your hand, a named item, or clear).
    usage: /warpicon <warp> [item|clear]
    permission: feather.setwarp
  delwarp:
    description: Delete a warp.
    usage: /delwarp <name>
    aliases: [rmwarp, deletewarp]
    permission: feather.setwarp
  back:
    description: Go back to where you were before teleporting or dying.
    usage: /back
    aliases: [return]
    permission: feather.back
  msg:
    description: Send a private message.
    usage: /msg <player> <message>
    aliases: [tell, w, m, whisper, pm, dm]
    permission: feather.msg
  reply:
    description: Reply to your last private message.
    usage: /r <message>
    aliases: [r]
    permission: feather.msg
  msgtoggle:
    description: Turn incoming private messages on or off.
    usage: /msgtoggle
    aliases: [togglemsg]
    permission: feather.msgtoggle
  socialspy:
    description: See everyone's private messages.
    usage: /socialspy
    aliases: [spy]
    permission: feather.socialspy
  realname:
    description: Find who is behind a nickname.
    usage: /realname <nickname>
    permission: feather.realname
  seen:
    description: When a player was last online.
    usage: /seen <player>
    permission: feather.seen
  gmc:
    description: Creative mode.
    usage: /gmc [player]
    aliases: [creative]
    permission: feather.gamemode
  gms:
    description: Survival mode.
    usage: /gms [player]
    aliases: [survival]
    permission: feather.gamemode
  gma:
    description: Adventure mode.
    usage: /gma [player]
    aliases: [adventure]
    permission: feather.gamemode
  gmsp:
    description: Spectator mode.
    usage: /gmsp [player]
    aliases: [spectator]
    permission: feather.gamemode
  god:
    description: Toggle god mode.
    usage: /god [player]
    aliases: [tgm, godmode]
    permission: feather.god
  heal:
    description: Heal fully (also fire, air, hunger and effects).
    usage: /heal [player]
    permission: feather.heal
  feed:
    description: Fill hunger.
    usage: /feed [player]
    aliases: [eat]
    permission: feather.feed
  smite:
    description: Strike lightning where you look, or at a player.
    usage: /smite [player]
    aliases: [lightning, strike, thor]
    permission: feather.smite
  spawnmob:
    description: Spawn mobs where you look.
    usage: /spawnmob <mob> [amount] [player]
    aliases: [mob, smob]
    permission: feather.spawnmob
  i:
    description: Give yourself an item (oraxen:<id> for Oraxen items).
    usage: /i <item> [amount] [player]
    aliases: [item]
    permission: feather.item
  itemname:
    description: Rename the held item (color codes and gradients work).
    usage: /itemname <name|off>
    aliases: [iname, rename]
    permission: feather.itemname
  fly:
    description: Toggle flight.
    usage: /fly [player]
    permission: feather.fly
  speed:
    description: Set walk or fly speed (1 = normal, 10 = max).
    usage: /speed <1-10> [player]
    permission: feather.speed
  vanish:
    description: Toggle vanish.
    usage: /vanish [player]
    aliases: [v]
    permission: feather.vanish
  invsee:
    description: Open a player's inventory.
    usage: /invsee <player>
    aliases: [inv]
    permission: feather.invsee
  enderchest:
    description: Open your (or a player's) ender chest.
    usage: /ec [player]
    aliases: [ec, echest]
    permission: feather.enderchest
  top:
    description: Go to the highest block above you.
    usage: /top
    permission: feather.top
  tphere:
    description: Bring a player to you.
    usage: /tphere <player>
    aliases: [tph, s]
    permission: feather.tphere
  broadcast:
    description: Announce to the server.
    usage: /broadcast <message>
    aliases: [bc, announce]
    permission: feather.broadcast
  craft:
    description: Open a crafting table.
    usage: /craft
    aliases: [workbench, wb]
    permission: feather.craft
  altars:
    description: Boss altar admin (list fights, reset cooldowns, end fights).
    usage: /altars [list|reset <player|here|all>|end <#|all> [refund]|summon <boss> [player]]
    aliases: [bossaltars]
    permission: feather.altars.admin
  pets:
    description: Your pets (summon, stay/follow, rename, release, revive, stable). /pets summon calls the following ones. /pets codex opens /codex.
    usage: /pets [summon|stable|admin setbond <player> <level> [pet]|admin codexreset <player>|admin nextvariant/setvariant/breedreset/worktime/workinfo <player> ...]
    aliases: [pet]
    permission: feather.pets
  bestiary:
    description: The bestiary of wild creatures (seen, harvested, slain, page rewards), on the codex's Wildlife tab.
    usage: /bestiary
    permission: feather.bestiary
  wildlife:
    description: Wild creatures (staff - info, due, tick, fedexpire, shed, dive, hotspot, moon, record, book, reset).
    usage: /wildlife [info|due|tick|fedexpire|shed|dive|hotspot|moon [on|off]|record <player> <mob> <seen|harvested|slain>|book [player]|reset <player>]
    permission: feather.bestiary
  afk:
    description: Mark yourself as away (again to come back).
    usage: /afk [message]
    aliases: [away]
    permission: feather.afk
  trail:
    description: Pick your flight trail (no style opens the menu).
    usage: /trail [style|off]
    aliases: [trails, flytrail]
    permission: feather.trails
  rtp:
    description: Teleport to a random spot in the wild.
    usage: /rtp [player] [world]
    aliases: [wild, randomtp, wilderness]
    permission: feather.rtp
  sit:
    description: Sit down (again to stand up).
    usage: /sit
    permission: feather.sit
  lay:
    description: Lie down (move, jump or sneak to get up).
    usage: /lay
    aliases: [lie, laydown]
    permission: feather.lay
  carry:
    description: Carrying players, blocks and mobs (toggle whether others can carry you, or put down what you carry).
    usage: /carry [toggle|drop]
    permission: feather.carry
  swim:
    description: Crawl on the ground (again or sneak to stand up).
    usage: /swim
    aliases: [crawl]
    permission: feather.swim
  maintenance:
    description: Turn maintenance mode on or off.
    usage: /maintenance [on|off]
    permission: feather.maintenance
  mute:
    description: Stop a player from chatting.
    usage: /mute <player> [10m|2h|7d|perm] [reason]
    aliases: [silence]
    permission: feather.mute
  unmute:
    description: Let a muted player chat again.
    usage: /unmute <player>
    permission: feather.mute
  ignore:
    description: Hide a player's chat, messages and teleport requests (no name lists them).
    usage: /ignore [player]
    aliases: [block]
    permission: feather.ignore
  unignore:
    description: Stop ignoring a player.
    usage: /unignore <player>
    aliases: [unblock]
    permission: feather.ignore
  clearchat:
    description: Clear the chat for everyone.
    usage: /clearchat
    aliases: [cc, chatclear]
    permission: feather.clearchat
  mutechat:
    description: Pause or reopen public chat.
    usage: /mutechat
    aliases: [lockchat]
    permission: feather.mutechat
  # --- Moderation suite (modules.moderation)
  kick:
    description: Kick a player, with a reason on their screen.
    usage: /kick <player> [reason]
    permission: feather.kick
  ban:
    description: Ban a player (online or not), for good or for a time.
    usage: /ban <player> [time] [reason]
    permission: feather.ban
  tempban:
    description: Ban a player for a while.
    usage: /tempban <player> <time> [reason]
    permission: feather.tempban
  unban:
    description: Lift a ban.
    usage: /unban <player>
    aliases: [pardon]
    permission: feather.unban
  banlist:
    description: List banned players, with reason and time left.
    usage: /banlist
    aliases: [bans]
    permission: feather.ban
  warn:
    description: Warn a player (they get a title; offline players see it when they next join).
    usage: /warn <player> <reason>
    permission: feather.warn
  warnings:
    description: Your warnings, or a player's (staff).
    usage: /warnings [player]
    aliases: [warns]
    permission: feather.warnings
  delwarn:
    description: Remove one of a player's warnings by its number.
    usage: /delwarn <player> <number>
    aliases: [unwarn]
    permission: feather.warn
  history:
    description: A player's moderation history (warnings, mutes, kicks, bans, freezes).
    usage: /history <player>
    aliases: [modhistory]
    permission: feather.history
  staffchat:
    description: Talk to staff only (no message toggles staff chat mode).
    usage: /sc [message]
    aliases: [sc]
    permission: feather.staffchat
  report:
    description: Report a player to the staff.
    usage: /report <player> <reason>
    permission: feather.report
  reports:
    description: Open reports (staff), with teleport, view and close.
    usage: /reports [tp|view|close <id>]
    permission: feather.reports
  freeze:
    description: Freeze a player in place (lasts across relogs until /unfreeze).
    usage: /freeze <player>
    aliases: [ss]
    permission: feather.freeze
  unfreeze:
    description: Unfreeze a player.
    usage: /unfreeze <player>
    permission: feather.freeze
  ping:
    description: Show your (or a player's) ping.
    usage: /ping [player]
    permission: feather.ping
  near:
    description: List players near you.
    usage: /near [radius]
    aliases: [nearby]
    permission: feather.near
  list:
    description: Who's online, by rank.
    usage: /list
    aliases: [online, who, players]
    permission: feather.list
  playtime:
    description: How long you (or a player) have played.
    usage: /playtime [player]
    aliases: [pt]
    permission: feather.playtime
  whois:
    description: Details about an online player.
    usage: /whois <player>
    permission: feather.whois
  trash:
    description: Open a bin; whatever is in it when you close it is deleted.
    usage: /trash
    aliases: [disposal, bin]
    permission: feather.trash
  anvil:
    description: Open an anvil.
    usage: /anvil
    permission: feather.workstation.anvil
  grindstone:
    description: Open a grindstone.
    usage: /grindstone
    permission: feather.workstation.grindstone
  stonecutter:
    description: Open a stonecutter.
    usage: /stonecutter
    permission: feather.workstation.stonecutter
  loom:
    description: Open a loom.
    usage: /loom
    permission: feather.workstation.loom
  cartography:
    description: Open a cartography table.
    usage: /cartography
    aliases: [cartographytable]
    permission: feather.workstation.cartography
  smithing:
    description: Open a smithing table.
    usage: /smithing
    aliases: [smithingtable]
    permission: feather.workstation.smithing
  skull:
    description: Get your (or a player's) head.
    usage: /skull [player]
    aliases: [playerhead]
    permission: feather.skull
  repair:
    description: Repair the held item (or everything with "all").
    usage: /repair [all]
    aliases: [fix]
    permission: feather.repair
  day:
    description: Set your world to morning.
    usage: /day
    permission: feather.time
  night:
    description: Set your world to night.
    usage: /night
    permission: feather.time
  sun:
    description: Clear the weather in your world.
    usage: /sun
    permission: feather.weather
  storm:
    description: Start rain in your world.
    usage: /storm
    aliases: [rain]
    permission: feather.weather
  sudo:
    description: Make a player run a command (c:<text> to chat).
    usage: /sudo <player> <command>
    permission: feather.sudo
  tpo:
    description: Teleport to a player straight away (ignores their request setting).
    usage: /tpo <player>
    aliases: [tpto, goto]
    permission: feather.tpo
  tpall:
    description: Bring every online player to you.
    usage: /tpall
    permission: feather.tpall
  tppos:
    description: Teleport to coordinates.
    usage: /tppos <x> <y> <z> [world]
    aliases: [tpcoords]
    permission: feather.tppos
  # --- Chest locks (modules.chest-locks)
  lock:
    description: Lock the chest or barrel you're looking at with a PIN, or manage your lock.
    usage: /lock [pin|auto [on|off]|allow [player]|disallow <player>|remove|givekey [player] [amount]]
    aliases: [chestlock, lockchest]
    permission: feather.locks
  unlock:
    description: Remove the lock from the chest or barrel you're looking at.
    usage: /unlock
    aliases: [chestunlock]
    permission: feather.locks
  inspect:
    description: Show the stats of the item in your hand (staff - someone else's).
    usage: /inspect [player]
    aliases: [itemstats, toolstats]
    permission: feather.inspect
  timezone:
    description: Pick the time zone times are shown in (no zone opens the picker).
    usage: /timezone [Area/City|reset]
    aliases: [tz]
    permission: feather.timezone
  stats:
    description: Your stats (or another player's).
    usage: /stats [player]
    aliases: [mystats]
    permission: feather.stats
  leaderboard:
    description: The leaderboards (blocks mined, playtime, kills ...).
    usage: /leaderboard [category]
    aliases: [lb, leaderboards]
    permission: feather.leaderboard
  analytics:
    description: Server analytics (or /analytics export | get <player> <stat> | flush).
    usage: /analytics [export|get|flush]
    permission: feather.analytics
  bounty:
    description: Put a bounty on a player, or list the active ones.
    usage: /bounty <player> | list | remove <player>
    aliases: [bounties]
    permission: feather.bounty
  bossboard:
    description: The weekly boss board (altar boss kills, fastest kills, top boss hunters).
    usage: /bossboard [last] | rollover | reset
    aliases: [bosses]
    permission: feather.bossboard
  recipes:
    description: Open the custom recipe manager (or list, reload, give <id> [player]).
    usage: /recipes [list|reload|give <id> [player]]
    aliases: [customrecipes]
    permission: feather.recipes.admin
  # --- Auth gate (modules.auth)
  auth:
    description: The auth gate - status, list, reset <player>, setcode <code>, clearcode.
    usage: /auth [status|list|reset <player>|setcode <code>|clearcode]
    aliases: [servercode]
    permission: feather.auth.admin
  # --- Death points (modules.death-point)
  deathpoint:
    description: Your last death points - coordinates, distance, Track (and Teleport for staff).
    usage: /deathpoint [track [n]|tp <n>]
    aliases: [dp, deathpoints]
    permission: feather.deathpoint
  grave:
    description: Your graves and who you trust with them; staff list, teleport to, open and remove graves.
    usage: /grave [trust|untrust <player>|trusted|list [player]|tp|open|remove <id>|age <id|player> <minutes>]
    aliases: [graves]
    permission: feather.grave
  bank:
    description: The bank screen (anywhere), /bank rob, /bank defend, or staff tools (create, remove, give, take, set, info, interest, robbery).
    usage: /bank [rob|defend|create|remove|list|give|take|set|info|interest|robbery]
    permission: feather.bank
  balance:
    description: Your Goob Coin balance in the bank.
    usage: /balance
    aliases: [bal, money]
    permission: feather.balance
  pay:
    description: Send Goob Coins from your bank balance to another player.
    usage: /pay <player> <amount>
    permission: feather.pay
  baltop:
    description: The richest players.
    usage: /baltop
    aliases: [balancetop, richest]
    permission: feather.baltop
  # --- Quests and the server goal (modules.quests)
  quests:
    description: Your daily and weekly quests (staff - admin reset, give, complete, progress, list).
    usage: /quests [admin reset|give|complete|progress|list ...]
    aliases: [quest, dailies]
    permission: feather.quests
  goal:
    description: This week's server goal (staff - admin set, skip, complete, add, info; rescale).
    usage: /goal [rescale | admin set|skip|complete|add|info|rescale ...]
    aliases: [servergoal]
    permission: feather.goal
  # --- Login calendar (modules.calendar)
  calendar:
    description: Your login streak, daily reward and playtime rewards (or claim, or staff tools with admin).
    usage: /calendar [claim [playtime]] | admin <player> info|streak <n>|playtime today|total <time>|nextday [days]|reset
    aliases: [streak]
    permission: feather.calendar
  # --- Mail and gifts (modules.mail)
  mail:
    description: Your letters, or send a letter or a gift (picked up at the mailbox at spawn); staff place mailboxes.
    usage: /mail [send <player> <message>|gift <player>|gifts|clear|mailbox create|remove|list]
    aliases: [inbox]
    permission: feather.mail
  trade:
    description: Trade items safely with a player nearby (a shared chest window), or answer a trade request.
    usage: /trade <player> | accept [player] | deny [player] | toggle
    permission: feather.trade
  # --- Chat games (modules.chatgames)
  chatgames:
    description: Your chat game wins and the top players (or turn the games off; staff start and stop games).
    usage: /chatgames [top|toggle] | start [type] [--answer] [--time <seconds>] | stop | reload | reset <player>
    aliases: [cg, chatgame]
    permission: feather.chatgames
  # --- Land claims (modules.claims)
  claim:
    description: The Land menu, or claim the chunk you stand in, list, rename, flags, show borders (staff - bypass and admin claims).
    usage: /claim [chunk|list|info|name <name>|abandon|flags|show|mode|transfer <player>|bypass|admin ...]
    aliases: [claims, land]
    permission: feather.claims
  unclaim:
    description: Unclaim the chunk you stand in (or the whole claim with "all").
    usage: /unclaim [all]
    aliases: [abandonclaim]
    permission: feather.claims
  trust:
    description: Trust a player (or everyone, "public") in the claim you stand in, or in all your claims.
    usage: /trust <player|public> [access|container|build|manager]
    aliases: [claimtrust]
    permission: feather.claims
  untrust:
    description: Take a player's (or everyone's) trust away.
    usage: /untrust <player|public>
    aliases: [claimuntrust]
    permission: feather.claims
  claimblocks:
    description: Your claim chunks (staff - another player's, or give, take or set them).
    usage: /claimblocks [player] [give|take|set <n>]
    aliases: [cblocks, claimchunks]
    permission: feather.claims

  # --- Holograms (modules.holograms)
  holo:
    description: Make and edit holograms (text, items, heads, blocks, mobs; pages, click actions, placeholders).
    usage: /holo create <name> [text] | delete | list | near [radius] | info | tp | movehere | move | addline | setline | insertline | removeline | line | page | set | action | copy | edit | view | reload
    aliases: [hologram, holograms]
    permission: feather.holograms.admin
  # --- Storage network + Quick Craft (modules.storage)
  storage:
    description: Storage network blocks (staff give them out with /storage give).
    usage: /storage give <player> <terminal|crafting|connector> [amount]
    aliases: [storagenetwork]
    permission: feather.storage.use
  quickcraft:
    description: Quick Craft from your inventory - every recipe you can make right now, one click each.
    usage: /quickcraft
    aliases: [qc, fastcraft]
    permission: feather.storage.quickcraft
  # --- Shop: General Store, sell-back counters, market stalls (modules.shop)
  shop:
    description: The General Store (paid from your bank balance); /shop sell at a fishmonger or grocer counter.
    usage: /shop [sell|featured]
    aliases: [store, generalstore]
    permission: feather.shop
  stall:
    description: Market stalls - rent one, place its keeper, sell from it, buy from others (staff - create, remove, list, expire, keepers).
    usage: /stall [rent|renew|leave|collect|info|keeper|create <name>|remove <name>|list|expire <name>|keeper <name>|keeper place <name> <x> <y> <z>|keeper remove <name>]
    aliases: [stalls, market]
    permission: feather.stall
  # --- Fishing (modules.fishing)
  fishing:
    description: Fishing - the Fish Journal, records and tournaments (staff - tournament start/stop, debug).
    usage: /fishing [journal|records|tournament [start <minutes>|stop]]
    aliases: [fish, fishjournal]
    permission: feather.fishing
  # --- Civic spawn furniture (modules.civic)
  civic:
    description: Spawn furniture tools (staff) - fountain goal link, info.
    usage: /civic fountain goal|info
    permission: feather.civic.admin
  # --- Farming (modules.farming)
  farming:
    description: Farming - the Harvest Fair (/farming fair, /farming fair submit) and staff test tools.
    usage: /farming fair [submit|judge] | debug ...
    aliases: [farm, harvestfair]
    permission: feather.farming
  # --- Gadgets / power (modules.gadgets, modules.power); Paper registered these at runtime
  gadgets:
    description: Inspect Feather gadgets near you, or reload gadgets.yml (staff).
    usage: /gadgets [info|reload]
    permission: feather.gadgets.admin
  power:
    description: Coal generators and fans (staff).
    usage: /power give <player> <fan|generator> [amount] | /power info
    permission: feather.power.admin
permissions:
  feather.player:
    description: Every player feature.
    default: true
    children:
      feather.tpa: true
      feather.tpahere: true
      feather.tpaccept: true
      feather.tptoggle: true
      feather.home: true
