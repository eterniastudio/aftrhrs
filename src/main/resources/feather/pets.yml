# Breeding: two of your own pets of the same species, both at bond min-bond or more, both set to Stay within
# distance blocks of each other. Feed each its tame item (the codex's / guide.yml's, or breeding.items.<species>) within
# feed-window-seconds; after delay-seconds of hearts a baby is born, tamed to you with a fresh bond. At your pet cap
# the baby goes to the stable if it has room; if both are full, breeding is refused before any item is used.
breeding:
  enabled: true
  min-bond: 3
  distance: 4
  feed-window-seconds: 60
  delay-seconds: 3
  # Each parent then rests this long before it can breed again.
  cooldown-hours: 24
  # Chance the baby takes a parent's color variant (when a parent has one); otherwise a normal roll.
  inherit-chance: 0.5
  # Shiny odds are multiplied by this when a parent is shiny.
  shiny-multiplier: 2
  # Species that never breed (one-of-a-kind pets), and whole kinds (pet, mount, hostile).
  exclude: [ArcanaLuna, ArcanaKevin, ArcanaKitty, ArcanaClover, ArcanaLunaTwo, ArcanaOlive, ArcanaOzzy, ArcanaFrogGuy, ArcanaEmperorPenguin, ArcanaRockhopperPenguin, ArcanaEmperorPenguinChick, ArcanaRockhopperPenguinChick]
  exclude-kinds: [mount, hostile]
  # Optional: a different breeding item per species, e.g. ArcanaCorgi: COOKIE. Default: the tame item.
  items: {}

# "Work Here" (pet menu): the pet stays at that spot and works within radius blocks. While its chunk is loaded the
# pack's job runs as usual; Feather does the rest: time its chunk was unloaded (you offline or far away) is caught
# up when it loads again, and jobs the pack only does near you (live: owner-away) or not while staying
# (live: always) are also done by Feather while it's loaded and you're not around. Never force-loads chunks.
work:
  enabled: true
  radius: 8
  # Blocks up and down from the spot that count.
  vertical: 2
  # At most this much work time is saved up (and caught up) at once.
  max-hours: 24
  # Catch-up work gets at most this much of each server tick.
  tick-budget-ms: 2
  # How often working pets that are loaded are checked.
  live-check-seconds: 60
  # After a chunk loads, wait this long (so the area around it has loaded too) before catching up.
  load-delay-ticks: 40
  # Each bond level makes a round this much faster (0.1 = 10% per level).
  bond-speedup: 0.1
  # You have to be this close to the pet to tell it to work.
  order-range: 24
  # live: owner-away counts the owner as away beyond this many blocks (a job can set its own owner-range).
  owner-range: 16
  # jobs.<species>: type crops | bloom | items; every-seconds: one round; live: always | owner-away | never.
  #   crops: each round bone-meals per-round crops (wheat, carrots, potatoes, beetroot, stems, berries, cocoa) that
  #          can still grow. Saplings are left alone.
  #   bloom: bone meal on up to max-per-run grass blocks per catch-up (flowers).
  #   items: one loot roll per round ("MATERIAL min-max weight") into the nearest chest or barrel in range; without
  #          one the job waits (the time is kept, up to max-hours). eats: chance a round's catch is eaten.
  #   needs: water (3+ water blocks next to the spot) or ground (natural ground under it).
  #   farmhand: each round harvests and replants per-round ripe crops (vanilla and Feather farming's) and puts the
  #          harvest into a chest or barrel within farming.yml farmhand.container-radius of the spot (else it waits).
  #   guard: nothing for Feather to do (the MythicMobs pack guards the spot); listed so Work Here keeps the spot.
  jobs:
    ArcanaMossbun:
      type: crops
      every-seconds: 120
      per-round: 4
      live: always
      description: grows the crops around it
    ArcanaGlimmermoth:
      type: bloom
      every-seconds: 600
      max-per-run: 6
      live: always
      description: spreads flowers on the grass around it
    ArcanaBurrowpip:
      type: items
      every-seconds: 600
      live: owner-away
      owner-range: 10
      needs: ground
      description: digs up finds into a chest or barrel
      loot: [FLINT 1-2 20, COAL 1-2 18, CLAY_BALL 1-3 16, IRON_NUGGET 1-3 14, COPPER_INGOT 1 12, GOLD_NUGGET 1-2 10,
             LAPIS_LAZULI 1-2 4, AMETHYST_SHARD 1 3.5, EMERALD 1 2, DIAMOND 1 0.5]
    ArcanaKevin:
      type: items
      every-seconds: 300
      live: never
      needs: water
      eats: 0.25
      description: fishes into a chest or barrel (and eats a few)
      loot: [COD 1 55, SALMON 1 30, TROPICAL_FISH 1 10, PUFFERFISH 1 5]
    ArcanaBlackCat:
      type: items
      every-seconds: 1200
      live: owner-away
      owner-range: 8
      description: leaves its morning gifts in a chest or barrel
      loot: [STRING 1-2 32, FEATHER 1-2 28, RABBIT_HIDE 1 22, RABBIT_FOOT 1 12, PHANTOM_MEMBRANE 1 6]
    ArcanaCloudlamb:
      type: items
      every-seconds: 600
      live: owner-away
      owner-range: 16
      description: sheds wool and string into a chest or barrel
      loot: [WHITE_WOOL 1 1, STRING 2 1]
    # Feather 1.4 farming (farming.yml)
    ArcanaCanopip:
      type: farmhand
      every-seconds: 120
      per-round: 4
      live: always
      description: harvests and replants ripe crops into a chest or barrel close by
    ArcanaBarkling:
      type: guard
      live: never
      description: guards this spot at night

rename:
  max-length: 24
  # Allowed characters (regular expression, plain text only).
  pattern: '^[\p{L}\p{N} _''.-]+$'

# "<sound key> [volume] [pitch]" or "none".
sounds:
  error: block.note_block.bass 0.6 0.6
  level-up: ui.toast.challenge_complete 0.7 1.3
  fallen: block.bell.resonate 0.8 0.6
  revive: item.totem.use 0.6 1.4
  summon: entity.enderman.teleport 0.5 1.4
  devoted: ui.toast.challenge_complete 0.8 1.6
  stable-in: block.barrel.close 0.6 1.2
  stable-out: block.barrel.open 0.6 1.2
  codex-seen: item.book.page_turn 0.7 1.2
  codex-milestone: entity.player.levelup 0.7 1.4
  variant: block.amethyst_block.chime 0.8 1.3
  shiny: entity.player.levelup 0.8 1.8
  breed-feed: entity.generic.eat 0.6 1.3
  born: entity.chicken.egg 0.8 1.2
  work: block.composter.fill_success 0.7 1.2

