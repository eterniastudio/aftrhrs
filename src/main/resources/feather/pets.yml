# Feather pets: /pets (alias /pet) lists your Arcana creatures; pet cap, bond levels, revive with plushies,
# and pets that follow you across worlds. /feather reload re-reads this file.
# Pets are stored in plugins/Feather/data/pets.yml.

cap:
  # Living pets per player (pets that died don't count). Permission feather.pets.cap.<n> raises/lowers it
  # (the highest one wins); feather.pets.cap.unlimited removes it.
  default: 6
  # Mounts take a slot too.
  count-mounts: true
  # Seconds between "you have too many pets" notices while someone keeps trying to tame.
  notice-cooldown-seconds: 10

# Pets that were tamed before this module existed (MythicMobs mobs listed under species with an owner) are added
# to their owner's roster when they load. Pets over the cap stay; their owner just can't tame more.
adopt-existing: true

follow:
  # After a teleport or world change, following pets (not ones told to stay) come along after this delay.
  delay-ticks: 20
  # A same-world teleport further than this also brings them along.
  far-distance: 48
  # Crossing worlds: "respawn" (the pet is spawned fresh next to you with its name, bond, health and owner,
  # and the old entity removed) or "teleport" (Paper moves the entity itself; falls back to respawn if that fails).
  cross-world: respawn
  # How long to wait for an unloaded pet's chunk to load its entities before giving up.
  load-timeout-ticks: 100

bond:
  # Bond XP needed for levels 0..5. The level is put on the pet as the MythicMobs variable caster.arcana_bond.
  levels: [0, 100, 300, 600, 1000, 1500]
  xp:
    # Every minute a following pet spends within near-radius of its owner.
    near-owner-per-minute: 3
    near-radius: 16
    # Feeding the pet its food (its heal item below), at most once per cooldown.
    feed: 10
    feed-cooldown-seconds: 60
    # The owner kills a mob while a following pet is within the radius.
    owner-kill: 2
    owner-kill-radius: 16
    owner-kill-cooldown-seconds: 3
    owner-kill-hostile-only: true
    # Upper limit for one featherpet{a=xp;amount=N} call from a MythicMobs skill.
    mechanic-max: 25
  level-up:
    title: true
    particles: true

revive:
  # Hold a dead pet's plushie and right-click the air to revive it (also from the /pets menu).
  right-click-air: true
  # Sneak + right-click a block with the plushie also revives (a plain right-click still places it).
  sneak-right-click-block: true

# Bond perks: what Feather itself adds as the bond grows (the pack's ability scaling comes on top).
# level: the bond level that unlocks the perk (1-5), 0 turns it off. Perks show in each pet's /pets page.
perks:
  # Right-click your own pet with an empty hand to pet it (any bond level): a little bond XP, once per cooldown.
  petting:
    xp: 3
    cooldown-seconds: 300
    # true: only while sneaking. Sneak + right-click is the pack's stay/follow toggle, so the default is false.
    sneak: false
  # Hearts when petted, and a name color of your choice (the "Name Color" button in the pet's page).
  affection:
    level: 1
    colors:
      Rose: '#ff9ecb'
      Peach: '#ffb98a'
      Butter: '#ffe38a'
      Mint: '#9ef0c0'
      Sky: '#8fd3ff'
      Lilac: '#c3a6ff'
      Snow: '#f4f4ff'
      Cocoa: '#c89b7b'
  # No fall damage. A following pet that is stuck (hasn't moved for 10 s) farther than stuck-distance from you,
  # or beyond follow.far-distance, is brought next to you (only while you stand on the ground).
  sure-footed:
    level: 2
    stuck-distance: 20
  # The pet heals pet-heal HP every 5 s within radius of you. If you drop below owner-below (a fraction of your
  # max health) with it near, you get Regeneration I for owner-regen-seconds, at most once per owner-cooldown-seconds.
  comfort:
    level: 3
    radius: 12
    pet-heal: 1.0
    owner-below: 0.3
    owner-regen-seconds: 5
    owner-cooldown-seconds: 300
  # One free revive from the /pets menu (no plushie) every <hours> per pet. A plushie in hand still uses the plushie.
  second-wind:
    level: 4
    hours: 24
  # A gentle aura around the pet (a particle name, or none), a title after its name, and a celebration in chat.
  devoted:
    level: 5
    title: Devoted
    aura: END_ROD
    # Also tell everyone online when a pet becomes devoted.
    broadcast: false

# The stable: park pets out of the world. Parked pets keep their name, bond and health, don't count toward the
# cap and can't die. Permission feather.pets.stable.<n> sets a player's stable size (the highest wins);
# feather.pets.stable.unlimited removes the limit.
stable:
  capacity: 9

# The creature codex (/codex, also /tamingguide and /pets codex): every creature the mod has, undiscovered, seen or
# (for the species below) tamed. Its text is guide.yml (taming) and codex.yml (everything else).
codex:
  enabled: true
  # Being within this many blocks of a creature counts as seeing it (checked every scan-seconds).
  seen-radius: 12
  scan-seconds: 2
  # Action bar note the first time you see a species.
  seen-notice: true
  # Rewards for the number of species tamed ("all" = every species that can be tamed). Each one is given once.
  # message: replaces messages.codex.milestone (MiniMessage; <count>, <tamed>, <total>, <player>).
  # commands: console commands, <player> is the player's name (e.g. 'give <player> minecraft:name_tag 1').
  # firework: a harmless firework burst over the player.
  milestones:
    5: {firework: true}
    10: {firework: true}
    20: {firework: true}
    all: {firework: true}
  # Rewards for the number of rare looks found (color variants plus shinies, over all species), each once.
  # Same keys as milestones (message: replaces messages.codex.variant-milestone; <count>, <found>, <player>).
  variant-milestones:
    3: {firework: true}
    10: {firework: true}
    25: {firework: true}

# Rare looks, rolled when a creature is tamed or born. A color variant tints the creature's ModelEngine model at
# runtime (the model and textures are never changed; the tint multiplies the texture, so light colors look best).
# Without ModelEngine the variant still shows in /pets, the stable and the codex. A shiny sparkles now and then and
# has a ✦ before its name; it stacks with a color variant. Both stay with the pet for life (death and revive, the
# stable, renames, restarts).
variants:
  enabled: true
  # Chance that a tame or birth gets one of its species' color variants (weights pick which). 0.05 = 1 in 20.
  color-chance: 0.05
  # Separate chance of a shiny. 0.00667 = about 1 in 150.
  shiny-chance: 0.00667
  shiny:
    symbol: '✦'
    # A simple Bukkit particle (no extra data) every every-seconds around a loaded shiny pet, or none.
    particle: FIREWORK
    every-seconds: 3
    count: 2
  # species.<MythicMobs id>.<key>: {name, tint: '#rrggbb', weight (default 1)}.
  species:
    ArcanaBeagle: {lemon: {name: Lemon, tint: '#FFE9AE'}, chocolate: {name: Chocolate, tint: '#C09274'}}
    ArcanaBlackCat: {smoke: {name: Smoke, tint: '#D0D0DC'}, midnight: {name: Midnight, tint: '#AEBBF2'}, plum: {name: Plum, tint: '#D8B0E6'}}
