# MiniMessage, with Feather's palette tags (<accent>, <text>, <muted>, <dim>, <good>, <bad>, <warn>, <sky>) and <prefix>.
# Every pet message can use <pet> (its name), <species>, <level> and <xp>. "" silences a message.
messages:
  world-names:
    overworld: the Overworld
    nether: the Nether
    end: the End
  tamed: '<prefix><good><pet></good> <muted>joined your pets</muted> <dim>(<count>/<cap>) · Shift + right-click: stay/follow · /pets'
  # the same, when it is the first of its kind in the player's codex (<tamed>/<tameable>: the codex count)
  tamed-first-kind: '<prefix><good><pet></good> <muted>joined your pets</muted> <dim>(<count>/<cap>)</dim> <accent>✎</accent> <muted>new in your codex</muted> <good><tamed>/<tameable></good> <dim>· Shift + right-click: stay/follow · /pets'
  data-error: '<prefix><bad>Pets are unavailable right now.</bad> <muted>Please let a staff member know.'
  guard:
    protected: '<muted><pet> belongs to <text><owner></text>. You can''t hurt it.'
  cap:
    reached: '<prefix><bad>You have too many pets (<cap>).</bad> <muted>Release one with</muted> <text>/pets</text> <muted>to make room.'
    # the action bar for further tries while the chat notice above is on its cooldown ("" turns it off)
    reached-bar: '<bad>Pet limit reached</bad> <muted>(<cap>) · /pets to release one'
  bond:
    level-up: '<prefix><accent><pet></accent> <muted>trusts you more: bond level</muted> <accent><level></accent><muted>!'
    level-up-title: '<gradient:#c3a6ff:#8fd3ff>Bond Level <level></gradient>'
    level-up-subtitle: '<text><pet> <muted>feels closer to you'
  fallen:
    - '<prefix><bad><pet> died</bad> <muted>at</muted> <text><x>, <y>, <z></text> <muted>in <world>.'
    - '<dim>   Hold its <plush> and right-click the air to bring it back, or use /pets.'
  revive:
    done: '<prefix><good><pet> is back by your side!'
    not-fallen: '<prefix><muted><pet> is alive and well.'
    at-cap: '<prefix><bad>You have too many pets (<cap>) to bring <pet> back.</bad> <muted>Release one first.'
    need-plushie: '<prefix><muted>You need a <text><species></text> plushie to bring <pet> back.'
    unavailable: '<prefix><bad><pet> can''t be brought back right now.'
    failed: '<prefix><bad>Something went wrong bringing <pet> back. Your plushie was returned.'
  follow:
    caught-up: '<muted><text><count></text> pet(s) caught up with you.'
  summon:
    arrived: '<good><pet></good> <muted>came running.'
    near: '<muted><pet> is right here.'
    ridden: '<prefix><muted>Someone else is riding <pet>.'
    failed: '<prefix><bad><pet> couldn''t reach you.</bad> <muted>Try again in a moment.'
    none: '<prefix><muted>No following pets to call. Pets told to stay keep waiting.'
    busy: '<muted><pet> is already on its way.'
  stay:
    not-loaded: '<prefix><muted><pet> is too far away to hear you. Summon it first.'
  rename:
    title: '<accent>Rename <pet>'
    body: '<muted>Pick a new name (up to <max> letters). Leave it empty to use the species name.'
    input: '<muted>Name'
    save: '<good>Save'
    reset: '<muted>Use the species name'
    invalid: '<bad>Letters, numbers, spaces and _ . '' - only, up to <max> characters.'
    tag-invalid: '<prefix><bad>That name can''t be used.</bad> <muted>Letters, numbers, spaces and _ . '' - only. <pet> keeps its name.'
    done: '<prefix><muted>Your pet is now called</muted> <text><pet></text><muted>.'
  release:
    title: '<bad>Release <pet>?'
    body: '<text><pet></text> <muted>will go back to the wild. Anyone can tame it again, and its bond is lost. This can''t be undone.'
    body-fallen: '<muted>Forget</muted> <text><pet></text><muted>? You won''t be able to revive it. This can''t be undone.'
    body-stabled: '<text><pet></text> <muted>will leave your stable and go back to the wild. Its bond is lost. This can''t be undone.'
    busy: '<prefix><muted><pet> is busy right now. Try again in a moment.'
    confirm: '<bad>Release'
    cancel: '<muted>Keep it'
    done: '<prefix><muted>Goodbye, <pet>.'
