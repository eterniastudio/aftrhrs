items:
  # Lore lines added under the item's own lore. <weight> is "3.2 lb", <name> the catcher.
  rarity-lore:
    common: '<#C9C2E8>★ Common'
    uncommon: '<#86E8B0>★ Uncommon'
    rare: '<#8FD3FF>★ Rare'
    legendary: '<#FFD24A>★ Legendary'
  rarity-color: {common: '<#C9C2E8>', uncommon: '<#86E8B0>', rare: '<#8FD3FF>', legendary: '<#FFD24A>'}
  weight-lore: '<muted><weight>'
  # A line under the weight by size class: juvenile (under 60% of the species' typical weight), adult, trophy (60% of
  # the way, in log terms, from typical to the species' max). Empty = no line.
  size-lore:
    juvenile: '<dim>Juvenile'
    adult: ''
    trophy: '<#FFD24A>✦ Trophy size'
  catcher-lore: '<dim>Caught by <name>'
  # Stand-in for a fish whose item doesn't exist yet.
  fallback-fish: COD
  # Stand-ins for other items while their item is missing (without one here, that catch just doesn't happen).
  fallback:
    arcana_shellfish_crab: {material: COD, name: Crab}
    arcana_shellfish_shrimp: {material: COD, name: Shrimp}
    arcana_shellfish_clam: {material: COD, name: Clam}
    arcana_pearl: {material: PRISMARINE_CRYSTALS, name: Pearl}
    arcana_black_pearl: {material: PRISMARINE_CRYSTALS, name: Black Pearl}

# Fish Journal (/fishing journal): coins when every species of a rarity is caught (once per player).
journal:
  rewards: {common: 40, uncommon: 100, rare: 250, legendary: 800}

# Fishing furniture (content ids; '*' is a wildcard).
furniture:
  scales: [arcana_fish_scale]
  plaques: ['arcana_*_trophy_plaque', 'arcana_trophy_plaque_*']
  tanks: [arcana_aquarium_tank]
  crab-pots: [arcana_crab_pot]

# The records board above every fish scale (needs the holograms module).
records-board:
  height: 2.2
  per-page: 6
  page-seconds: 6
  view-distance: 24

# Trophy plaques: where the fish sits in the plaque's model (px, 0..16, model north = the front), its size, and the
# label (Moonkoi · 6.2 lb · Name) above it. yaw-offset / roll turn the fish if the model needs it. The fish is drawn
# at fish-scale times its weight's length scale (a heavier fish is bigger), kept within size-range so a minnow still
# shows and a shark doesn't hang off the wall.
plaque:
  fish-point: [8, 9.5, 13]
  fish-scale: 0.7
  size-range: [0.55, 1.3]
  yaw-offset: 0
  roll: 0
  label: true
  label-point: [8, 17, 12]

# Aquarium tanks: one point per fish (px in the tank's model; the length of this list is how many fit). Each fish is
# drawn at fish-scale times its weight's length scale, kept within size-range (bigger fish turn less).
tank:
  points: [[4.5, 9, 6], [11.5, 11, 9], [7.5, 6.5, 11]]
  fish-scale: 0.42
  size-range: [0.55, 1.2]
  bob: 0.04
  turn-degrees: 9
  # Animation step (ticks) and how near a player must be for the fish to move.
  animate-ticks: 20
  animate-distance: 32
  # Vanilla fish that may go in a tank too (custom fish always can).
  vanilla-fish: [COD, SALMON, TROPICAL_FISH, PUFFERFISH]

# Crab pots: one catch every min-max minutes while in water, up to capacity held. Time runs on while unloaded and
# across restarts. A species (arcana_fish_<id>) is only caught where it lives (its water, biomes and climate) and is
# weighed and journaled like a rod catch when collected.
crab-pots:
  min-minutes: 6
  max-minutes: 10
  capacity: 5
  catch: [arcana_shellfish_crab 45, arcana_shellfish_shrimp 35, arcana_shellfish_clam 20, arcana_fish_crawfish 30,
          arcana_fish_mitten_crab 12]
  bubble-distance: 24

# Tournaments: the biggest single custom fish wins. prizes: coins for 1st, 2nd, 3rd ... (into the bank balance).
tournament:
  prizes: [500, 250, 100]
  max-minutes: 1440
  # Weekend tournaments, in config.yml daily.reset-zone.
  schedule:
    enabled: true
    days: [SATURDAY, SUNDAY]
    time: '20:00'
    minutes: 60

# Message bottles (right-click to open): one reward. "coins min-max weight", "minecraft:<item> min-max weight" or a
# content id. The note is a random line from messages.yml fishing.bottle.notes.
bottle:
  item: arcana_message_bottle
  rewards: [coins 3-8 40, minecraft:emerald 1-2 15, arcana_sea_glass_shard_aqua 1-2 10, arcana_seashell 1-3 10,
            arcana_pearl 1 6, arcana_worm_bait 2-4 12, minecraft:nautilus_shell 1 3, minecraft:name_tag 1 4]
