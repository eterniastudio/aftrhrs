# Feather fishing (modules.fishing). Full documentation: docs/fishing.md. /feather reload re-reads this file.
# Custom fish replace vanilla catches by biome group, climate, time, weather, open water, rod, bait, enchantments,
# Lucky Lure and a following Ripplekit. Items are content items (arcana_fish_<id>, arcana_shellfish_*, ...); while one
# is missing a plain stand-in (items.fallback-fish / items.fallback) is used, so nothing breaks before the art is in.
# Data: plugins/Feather/data/fishing.yml (journals, records, a running tournament); crab pots live in chunk data.
# Weights are grams everywhere in this file and in the data; players see pounds ("3.2 lb").

catch:
  # Of the common rolls, this share keeps the vanilla fish (cod, salmon ...) instead of a custom common.
  vanilla-common-share: 0.5
  # Rarity odds (relative) before the gear bonuses. A tier with nothing that can bite here is skipped.
  # (Was 70/22/7/1: with the old open-water rule and three strikes, players saw almost only commons.)
  rarity-weights: {common: 62, uncommon: 26, rare: 10, legendary: 2}
  # From this rarity up a fish only bites in open water (vanilla's open-water check: no blocks around the bobber):
  # none | rare | legendary. Replaces the old rare-needs-open-water switch.
  open-water-from: legendary
  # A species' liked bait (species.<id>.bait) multiplies its chance by this while that bait is on.
  preferred-bait-bonus: 2.5
  # "Underground": the bobber is below max-y with at most this much sky light.
  underground: {max-y: 50, max-sky-light: 3}
  # Salt water (biome groups below): a common/uncommon roll becomes a shellfish this often.
  shellfish-chance: 0.04
  shellfish: [arcana_shellfish_crab 45, arcana_shellfish_shrimp 35, arcana_shellfish_clam 20]
  # Vanilla junk is swapped for a beach find this often (treasure always stays). "id weight" or "id min-max weight".
  extras-chance: 0.5
  extras:
    salt: [arcana_seashell 30, arcana_sand_dollar 18, arcana_driftwood 14, arcana_message_bottle 6,
           arcana_sea_glass_shard_white 5, arcana_sea_glass_shard_aqua 5, arcana_sea_glass_shard_green 5,
           arcana_sea_glass_shard_blue 4, arcana_sea_glass_shard_amber 3]
    fresh: [arcana_driftwood 40, arcana_message_bottle 4]
  # Everyone hears about legendary catches.
  broadcast-legendary: true

# Fishing enchantments on the rod in use (main hand first). Per level:
#   <rarity>-per-level: that rarity's odds x (1 + value x level)   (Luck of the Sea III: rare x1.9, legendary x2.05)
#   weight-skew-per-level: the typical weight moves this share of the way (in log terms) toward the species' max
#   trophy-chance-per-level: chance of a trophy roll (between the trophy line and the max) instead of a normal one
#   fight-per-level: reel power in the reel-in fight (+5% per level)
# Lure keeps vanilla's faster bites (5 s less waiting per level) and adds a smaller weight bonus. The Fish Journal
# shows what the player's rod does ("Your rod (Luck of the Sea III): rare x1.90 ...").
enchantments:
  luck-of-the-sea:
    uncommon-per-level: 0.10
    rare-per-level: 0.30
    legendary-per-level: 0.35
    weight-skew-per-level: 0.12
    trophy-chance-per-level: 0.04
    fight-per-level: 0.05
  lure:
    weight-skew-per-level: 0.04
    trophy-chance-per-level: 0.0
  # Caps for everything together (skew 0.85 = the typical weight 85% of the way to the max).
  max-weight-skew: 0.85
  max-trophy-chance: 0.5

# The reel-in fight (players with the Companion mod's fishing feature): rare and legendary fish, and any fish heavier
# than heavy-grams, aren't landed on the click: a tension bar comes up. Hold to reel (tension rises, line comes in),
# let go when it strains (tension falls, the fish takes line). Snap the line or let it take all the line and it's
# gone. The server replays the client's inputs and decides; no answer within max-seconds (+ latency slack) loses it.
# Heavier fish pull harder; Luck of the Sea and a rod's "fight" (rods: below) reel faster; Unbreaking strengthens the
# line. enabled: false (or a client without the feature) falls back to the strike window below.
fight:
  enabled: true
  min-rarity: rare
  heavy-grams: 4000
  max-seconds: 45
  latency-slack-ms: 1500
  unbreaking-line-per-level: 0.06

# The strike window (fallback when there's no fight): rare fish give a distinct splash on the bite, reel within
# window-ms or it escapes. Legendary: that many strikes in a row (after each strike the bobber stays in and the fish
# bites again after rebite-ticks).
strike:
  enabled: true
  window-ms: 1000
  legendary-strikes: 2
  rebite-ticks: [30, 70]
  sound: entity.player.splash.high_speed 1.0 0.7
  sound-legendary: entity.elder_guardian.flop 1.0 0.6
  hit-sound: entity.fishing_bobber.retrieve 1.0 0.6

# Player PDC feather:lucky_lure_until (epoch ms), set by the fountain coin toss (civic module).
lucky-lure:
  rare-multiplier: 1.5
  legendary-multiplier: 1.5

# A Ripplekit following its owner within radius: bites come faster, rare+ odds go up. Right-click your own Ripplekit
# with a clam: it cracks it (a pearl, sometimes a black pearl).
ripplekit:
  mob: ArcanaRipplekit
  radius: 12
  bite-speed: 0.75
  rare-weight: 1.3
  clam: arcana_shellfish_clam
  pearl: arcana_pearl
  black-pearl: arcana_black_pearl
  black-pearl-chance: 0.15
  # ModelEngine clip the Ripplekit plays while cracking (its 2 s "sits up and knocks the clam" clip); none = off.
  crack-animation: ability

# Squallgull hotspots (wildlife module): a bobber that lands in one bites faster and rare+ odds go up. The numbers
# live in wildlife.yml (hotspots.bite-speed-multiplier / rare-weight-multiplier); this only switches the bonus off.
hotspots:
  enabled: true

# Rods (by content id). speed: bite wait multiplier (lower = faster). weights: rarity odds multipliers. fight: extra
# reel power in the reel-in fight (0.15 = 15% faster).
rods:
  arcana_driftwood_rod: {speed: 0.75, fight: 0.05}
  arcana_coral_rod: {weights: {rare: 1.6, legendary: 1.3}, fight: 0.10}
  # The Abyssal Rod is the only rod the Abyssal Leviathan Eel takes (needs-rod below), and lifts legendary odds.
  arcana_abyssal_rod: {weights: {rare: 1.2, legendary: 3.0}, fight: 0.20}

# Bait in the off hand (rod in the main hand), one used per catch. when: any | salt | fresh | night | day | rain.
# Species can like one bait (species.<id>.bait): its chance x catch.preferred-bait-bonus while it is on.
bait:
  arcana_worm_bait: {speed: 0.8, weights: {common: 1.4}}
  arcana_grub_bait: {weights: {common: 0.6, uncommon: 1.7, rare: 1.2, legendary: 1.1}}
  arcana_shrimp_bait: {when: salt, weights: {rare: 2.0, legendary: 1.3}}
  arcana_glow_bait: {when: night, weights: {rare: 2.0, legendary: 1.3}}

# Biome groups: '#tag' (a biome tag; Terralith adds its biomes to the vanilla is_* tags), 'pattern*' (glob on the
# full key, so terralith:warm_river matches '*river*'), an exact key, '@group' (everything in another group), and any
# of those with a leading '!' to leave biomes out ('*' with exclusions = "everything else"). A biome can be in several
# groups. Water type: river, pond (still water: lakes, ponds, swamps), brackish (river mouths: beaches, mangroves),
# coast / reef (shallow sea), ocean / deep_ocean (open sea). Temperature: tropical, temperate, cold (species
# climate:). Vanilla rivers count as temperate (frozen rivers as cold); Terralith's warm_river is tropical.
biome-groups:
  ocean: ['#is_ocean', '*ocean*']
  deep_ocean: ['#is_deep_ocean', '*deep*ocean*']
  warm_ocean: ['minecraft:warm_ocean', '*lukewarm*', '*warm_ocean*', '*tropical*ocean*']
  lukewarm_ocean: ['*lukewarm*']
  cold_ocean: ['*cold_ocean*', '*frozen_ocean*']
  cold_water: ['*cold_ocean*', '*frozen_ocean*', '*frozen_river*', '*ice_marsh*', '*glacial*']
  beach: ['#is_beach', '*beach*', '*shore*']
  river: ['#is_river', '*river*']
  swamp: ['*swamp*', '*mangrove*', '*marsh*', '*bayou*']
  jungle: ['#is_jungle', '*jungle*', '*rainforest*']
  frozen: ['*frozen*', '*snowy*', '*ice*', '*glacial*', '*wintry*', '*siberian*', '*tundra*', 'minecraft:grove',
           'minecraft:jagged_peaks', 'minecraft:snowy_slopes']
  lush_caves: ['minecraft:lush_caves', 'minecraft:dripstone_caves', 'terralith:cave/*']
  pond: ['*', '!@ocean', '!@river', '!@beach', '!#is_nether', '!#is_end', '!*nether*', '!*the_end*']
  reef: ['@warm_ocean', '!@deep_ocean']
  coast: ['@beach', '@ocean', '!@deep_ocean']
  brackish: ['@beach', '*mangrove*', '*delta*', '*estuary*', '*bayou*']
  tropical: ['#spawns_warm_variant_farm_animals', '*jungle*', '*tropical*', '*rainforest*', '*savanna*', '*desert*',
             '*badlands*', '*mesa*', '*oasis*', '*mangrove*', '*warm*', '*hot_*', '*arid*', '*volcanic*', '*bayou*',
             'terralith:ancient_sands', 'terralith:mirage_isles', 'terralith:sandstone_valley',
             '#terralith:reference/temperature/warm', '!@frozen', '!*snowy*']
  cold: ['#spawns_cold_variant_farm_animals', '@frozen', '@cold_water', '*taiga*', '*cold*', '*alpine*', '*glacial*',
         '*tundra*', '*siberian*', '*snow*', '*frozen*', '*wintry*', '*windswept*', '*_peaks', 'minecraft:grove',
         '#terralith:reference/temperature/cold', '#terralith:reference/temperature/frozen_all', '!@tropical']
  temperate: ['*', '!@tropical', '!@cold']
# Groups that are salt water (everything else is fresh).
salt-water-groups: [ocean, beach]
# How the journal's hints name the groups ("Bites in ponds and lakes in a tropical climate at night").
hint-names:
  ocean: the ocean
  deep_ocean: the deep ocean
  warm_ocean: warm seas
  lukewarm_ocean: lukewarm seas
  cold_ocean: cold seas
  cold_water: icy water
  beach: beaches
  river: rivers
  swamp: swamps
  jungle: jungle waters
  frozen: frozen lands
  lush_caves: lush caves
  pond: ponds and lakes
  reef: warm reefs
  coast: coastal shallows
  brackish: river mouths
  tropical: tropical
  temperate: temperate
  cold: cold

