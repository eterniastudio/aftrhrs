  claim-big: '<accent>✦</accent> <text>Claim Day 7'
  claim-tooltip: '<reward>'
  claim-playtime: '<sky>⌚</sky> <text>Claim Playtime (<count>)'
  claim-playtime-tooltip: '<muted>Every playtime reward that is waiting'
  prompt: '<prefix><good>☀</good> <text>Your daily reward is waiting</text> <dim>(day <day>: <reward><dim>)</dim> <claim>'
  prompt-big: '<prefix><accent>✦</accent> <text>Day 7! The big reward is waiting</text> <dim>(<reward><dim>)</dim> <claim>'
  prompt-button:
