# Feather messages, in MiniMessage (https://docs.advntr.dev/minimessage/format).
# Palette tags below work everywhere: <accent>, <sky>, <text>, <muted>, <dim>, <good>, <bad>, <warn>,
# <coin> (Goob Coin gold) and <gem> (diamond cyan).
# <prefix> inserts the prefix. A message can be one line or a list of lines. "" silences a message.
# In menus, write a literal "<" as "\<".

palette:
  accent: '#C3A6FF'
  sky: '#8FD3FF'
  text: '#F1EDFF'
  muted: '#A49DC2'
  dim: '#6B6487'
  good: '#86E8B0'
  bad: '#FF8FA3'
  warn: '#FFD38A'
  coin: '#FFD24A'
  gem: '#7FE3FF'

prefix: '<gradient:#c3a6ff:#8fd3ff><b>✦</b></gradient> '

# The join digest: what waits for a player who just joined, as one message (config.yml chat.join-digest).
# <line> is each module's own message (its prefix left out).
join-digest:
  header: ' <accent>✦</accent> <muted>While you were away:'
  line: '   <dim>•</dim> <line>'

general:
  players-only: '<prefix><bad>Only players can do that.'
  no-permission: '<prefix><bad>You can''t do that.'
  player-not-found: '<prefix><muted>Nobody called</muted> <text><input></text> <muted>is online.'
  player-ambiguous: '<prefix><text><input></text> <muted>could be</muted> <text><matches></text><muted>. Type a bit more of the name.'
  reloaded: '<prefix><good>Feather reloaded.'
  reload-failed: '<prefix><bad>Reload failed:</bad> <muted><error></muted> <dim>(see console)'

menu:
  close: '<muted>Close'
  back: '<muted>← Back'

  hub:
    title: '<gradient:#c3a6ff:#8fd3ff><b>✦ Aftr Hrs ✦</b></gradient>'
    greeting:
      - '<hello>'
      - '<status>'
    # <hello> is picked at random from the list for the time of day in the player's world (rain wins over the
    # time; "elsewhere" is the Nether, the End and other skyless worlds). Lines can use <name>, <moon> (tonight's
    # moon, drawn from the server pack) and <phase> (its name from moon-phases).
    hello:
      dawn:
        - '<text>Early start,</text> <name><text>!</text> <muted>The sun''s just peeking up.</muted>'
        - '<text>Rise and shine,</text> <name><text>!</text> <muted>Still sleepy?</muted>'
      morning:
        - '<text>Morning,</text> <name><text>!</text> <muted>Fresh day, fresh plans.</muted>'
        - '<text>Hey,</text> <name><text>!</text> <muted>Where to this morning?</muted>'
      afternoon:
        - '<text>Hey,</text> <name><text>!</text> <muted>What are we getting up to?</muted>'
        - '<text>Afternoon,</text> <name><text>!</text> <muted>Good day for a wander.</muted>'
      dusk:
        - '<text>Golden hour,</text> <name><text>.</text> <muted>Heading home or staying out?</muted>'
        - '<text>Evening,</text> <name><text>!</text> <muted>Night''s almost here.</muted>'
      night:
        - '<text>Hey,</text> <name><text>!</text> <muted>What are we doing tonight?</muted>'
        - '<text>Up late,</text> <name><text>?</text> <moon> <muted><phase> tonight.</muted>'
        - '<text>After hours,</text> <name><text>.</text> <moon> <muted>Mind the dark.</muted>'
      rain:
        - '<text>Rainy one,</text> <name><text>.</text> <muted>Cozy up somewhere?</muted>'
        - '<text>Hey,</text> <name><text>!</text> <muted>Don''t forget an umbrella.</muted>'
      elsewhere:
        - '<text>Hey,</text> <name><text>!</text> <muted>Long way from home, huh?</muted>'
    moon-phases: [Full moon, Waning gibbous, Last quarter, Waning crescent, New moon, Waxing crescent, First quarter, Waxing gibbous]
    moon-fallback: '<warn>☾</warn>'
    status: '<accent>⌂</accent> <text><homes></text> <muted>Homes</muted>   <dim>·</dim>   <good>❤</good> <text><pets></text> <muted>Pets</muted>   <dim>·</dim>   <requests>'
    status-no-pets: '<accent>⌂</accent> <text><homes></text> <muted>Homes</muted>   <dim>·</dim>   <requests>'
    status-requests-on: '<good>●</good> <muted>Requests On</muted>'
    status-requests-off: '<bad>●</bad> <muted>Requests Off</muted>'
    # The hub, two per row: Homes, Warps & Spawn, Visit a Friend, Pets, Community, Style, Taming Guide, Settings.
    # Community and Style open a second screen headed by <key>-title and <key>-body. Labels are Title Case.
    visit: '<sky>➶</sky> <text>Visit a Friend'
    visit-tooltip: '<text>Ask to visit a friend, or bring them to you</text><newline><dim>/tpa · /tpahere'
    # Added to Visit a Friend while teleport requests are waiting for the player.
    teleport-badge: ' <warn>✉ <count></warn>'
    community: '<warn>★</warn> <text>Community'
    community-tooltip: '<text>Bounties, leaderboards and your stats</text><newline><dim>/bounty · /lb · /stats'
    community-title: '<warn>★</warn> <text><b>Community'
    community-body: '<muted>Check the bounty board, see who''s on top or look at your own numbers.'
    bounties: '<bad>☠</bad> <text>Bounties'
    bounties-tooltip: '<text>Who has a price on their head</text><newline><dim>/bounty list · /bounty <player>'
    leaderboards: '<warn>★</warn> <text>Leaderboards'
    leaderboards-tooltip: '<text>The server''s top players</text><newline><dim>/leaderboard'
    stats: '<accent>▤</accent> <text>My Stats'
    stats-tooltip: '<text>Everything you''ve done on <server></text><newline><dim>/stats'
    bossboard: '<bad>⚔</bad> <text>Boss Board'
    bossboard-tooltip: '<text>This week''s boss kills and the fastest parties</text><newline><dim>/bossboard'
    calendar: '<warn>✹</warn> <text>Calendar'
    calendar-tooltip: '<text>Your login streak and playtime rewards</text><newline><dim>/calendar'
    mail: '<sky>✉</sky> <text>Mail'
    mail-tooltip: '<text>Letters and gifts from your friends</text><newline><dim>/mail · /mail send · /mail gift'
    trade: '<sky>⇄</sky> <text>Trade'
    trade-tooltip: '<text>Swap items safely with someone nearby</text><newline><dim>/trade \<player>'
    shop: '<coin>⛃</coin> <text>Shop'
    shop-tooltip: '<text>The General Store: seeds, bait, rods and more, paid from your bank balance</text><newline><dim>/shop · /bank · /stall'
    chatgames: '<warn>◆</warn> <text>Chat Games'
    chatgames-tooltip: '<text>Your chat game wins and the top players</text><newline><dim>/chatgames'
    fishing: '<sky>≈</sky> <text>Fish Journal'
    fishing-tooltip: '<text>Species you''ve caught, best weights and the records</text><newline><dim>/fishing journal'
    style: '<warn>✎</warn> <text>Style'
    style-tooltip: '<text>Nickname, hats, trails and poses</text><newline><dim>/nick · /hat · /trail · /sit · /lay · /crawl · /afk'
    style-title: '<warn>✎</warn> <text><b>Style'
    style-body: '<muted>Look the part, or take a load off. Move, jump or sneak to get up again.'
    settings: '<muted>⚙</muted> <text>Settings'
    settings-tooltip: '<text>Who can reach you, carry you or ping you</text><newline><dim>/tptoggle · /msgtoggle · /carry toggle'
    homes: '<sky>⌂</sky> <text>Homes'
    homes-tooltip: '<text>Your saved places</text><newline><dim>/home · /sethome'
    warps: '<sky>⚑</sky> <text>Warps & Spawn'
    warps-tooltip: '<text>Spawn, the server''s warps, the wild and the way back</text><newline><dim>/spawn · /warp · /rtp · /back'
    spawn: '<sky>✦</sky> <text>Spawn'
    spawn-tooltip: '<text>Head back to spawn</text><newline><dim>/spawn'
    wild: '<sky>✧</sky> <text>Wild'
    wild-tooltip: '<text>Teleport to a random spot in the wild</text><newline><dim>/rtp'
    back: '<sky>↶</sky> <text>Go Back'
    back-tooltip: '<text>Return to where you last teleported from or died</text><newline><dim>/back'
    pets: '<accent>❤</accent> <text>Pets'
    pets-tooltip: '<text>Call, rename, revive and release your pets</text><newline><dim>/pets'
    codex: '<accent>✎</accent> <text>Creature Codex'
    codex-tooltip: '<text>Every creature: how to tame it, where it lives, bosses</text><newline><dim>/codex'
    # Style
    nick: '<warn>✎</warn> <text>Nickname'
    nick-tooltip: '<text>Change the name chat shows</text><newline><dim>/nick'
    hat: '<warn>♛</warn> <text>Wear As Hat'
    hat-tooltip: '<text>Put the item in your hand on your head</text><newline><dim>/hat'
    trails: '<warn>✺</warn> <text>Flight Trails'
    trails-tooltip: '<text>Pick the sparkles you leave while flying</text><newline><dim>/trail'
    sit: '<good>☁</good> <text>Sit'
    sit-tooltip: '<text>Sit down where you stand (again to get up)</text><newline><dim>/sit'
    lay: '<good>☾</good> <text>Lie Down'
    lay-tooltip: '<text>Lie down (move, jump or sneak to get up)</text><newline><dim>/lay'
    crawl: '<good>≈</good> <text>Crawl'
    crawl-tooltip: '<text>Crawl along the ground (again or sneak to stand)</text><newline><dim>/crawl'
    afk: '<good>⌛</good> <text>AFK'
    afk-tooltip: '<text>Let everyone know you''re away</text><newline><dim>/afk'
    # Daily: the login calendar, quests and the server goal
    daily: '<good>☀</good> <text>Daily'
    daily-tooltip: '<text>Quests, your login streak and the server goal</text><newline><dim>/quests · /calendar · /goal'
    daily-title: '<good>☀</good> <text><b>Daily'
    daily-body: '<muted>Something new every day. Come back tomorrow for more.'
    quests: '<warn>◆</warn> <text>Quests'
    quests-tooltip: '<text>Today''s and this week''s quests and their rewards</text><newline><dim>/quests'
    goal: '<accent>✦</accent> <text>Server Goal'
    goal-tooltip: '<text>This week''s goal for the whole server</text><newline><dim>/goal'

  # The hub's Settings: one toggle per row. <setting> is the setting's name below.
  settings:
    timezone: '<sky>◷</sky> <text>Time Zone</text> <dim>·</dim> <muted><zone>'
    timezone-tooltip: '<text>Times in /inspect and elsewhere use your time zone</text><newline><dim>/timezone'
    # Opens the mod's HUD & display settings (companion.features.hud).
    hud: '<accent>✦</accent> <text>HUD & Display'
    hud-tooltip: '<text>Switch the compass, quest sidebar, pet portraits, waypoints and more on or off,</text><newline><text>and move or resize any of them'
    title: '<muted>⚙</muted> <text><b>Settings'
    body: '<muted>Choose who can reach you. Click a setting to switch it.'
    enabled: '<good>●</good> <setting> <dim>·</dim> <good>On'
    disabled: '<bad>●</bad> <setting> <dim>·</dim> <bad>Off'
    requests: '<text>Teleport Requests'
    requests-tooltip: '<text>Let others ask to visit you or bring you over</text><newline><dim>/tptoggle'
    messages: '<text>Private Messages'
    messages-tooltip: '<text>Let others send you private messages</text><newline><dim>/msgtoggle'
    carry: '<text>Let Others Carry You'
    carry-tooltip: '<text>Others pick you up with sneak + right-click</text><newline><dim>/carry toggle'
    mentions: '<text>Mention Pings'
    mentions-tooltip: '<text>A sound and a note when chat says your name'
    mentions-toggled-on: '<prefix><muted>Mention pings</muted> <good>on</good><muted>.'
    mentions-toggled-off: '<prefix><muted>Mention pings</muted> <bad>off</bad><muted>. Chat won''t ping you.'
    trades: '<text>Trade Requests'
    trades-tooltip: '<text>Let others ask to trade with you</text><newline><dim>/trade toggle'
    chatgames: '<text>Chat Games'
    chatgames-tooltip: '<text>Quizzes and word games in chat, with coins for the winner</text><newline><dim>/chatgames toggle'
    damage-numbers: '<text>Damage Numbers'
    damage-numbers-tooltip: '<text>Little numbers that pop up when something near you is hurt or healed'

  warps:
    title: '<warn>⚑</warn> <text><b>Warps</b></text> <dim><count>'
    body: '<muted>Where to?'
    empty: '<muted>No warps yet - staff can add them with /setwarp.'
    spawn: '<good>✦</good> <text>Spawn'
    entry: '<warn>⚑</warn> <text><name>'

  tpa:
    title: '<sky>➶</sky> <text><b>Teleport</b>'
    pending-header: '<accent>✦</accent> <text>Waiting For You</text> <dim>(<count>)'
    pending: '<good>✔</good> <sender> <dim>→ you'
    pending-here: '<good>✔</good> <dim>you →</dim> <sender>'
    pending-tooltip: '<muted>Open this request</muted><newline><dim>expires in <seconds>s'
    players-header: '<muted>Who do you want to visit?'
    nobody-online: '<muted>Nobody else is online right now.</muted><newline><dim>It''s quiet... too quiet.'
    player-tooltip: '<muted>Choose what to ask <name>'
    player-title: '<sky>➶</sky> <name>'
    player-body: '<muted>Send</muted> <name> <muted>a request. They get a sound and a message to accept.'
    go-to: '<sky>➶</sky> <text>Go To Them'
    go-to-tooltip: '<muted>Ask to teleport to</muted> <name>'
    bring-here: '<accent>⇲</accent> <text>Bring Them Here'
    bring-here-tooltip: '<muted>Ask</muted> <name> <muted>to teleport to you'
    request-title: '<accent>✦</accent> <text><b>Teleport Request'
    request-body: '<sender> <muted>wants to teleport</muted> <text>to you</text><muted>.'
    request-body-here: '<sender> <muted>wants you to teleport</muted> <text>to them</text><muted>.'
    accept: '<good><b>✔ Accept'
    deny: '<bad><b>✖ Deny'

  homes:
    title: '<accent>⌂</accent> <text><b>Homes</b></text> <dim><count>/<limit>'
    body: '<muted>Click a home to go there.</muted> <dim>✎ moves, renames or deletes it.'
    empty: '<muted>You don''t have any homes yet.</muted><newline><dim>Save the spot you''re standing on:'
    entry: '<accent>⌂</accent> <text><name>'
    entry-tooltip: '<muted><world></muted><newline><dim><coords>'
    manage: '<muted>✎ Edit'
    manage-tooltip: '<muted>Move, rename or delete</muted> <text><name>'
    new: '<good>+</good> <text>New Home Here'
    new-tooltip: '<muted>Save where you''re standing'
    home-title: '<accent>⌂</accent> <text><b><name>'
    home-body:
      - '<muted>World</muted>      <text><world>'
      - '<muted>Position</muted>  <text><coords>'
      - '<muted>Distance</muted>  <text><distance>'
    teleport: '<sky>➶</sky> <text>Teleport'
    move-here: '<accent>⤓</accent> <text>Move Here'
    move-here-tooltip: '<muted>Move this home to where you''re standing'
    rename: '<warn>✎</warn> <text>Rename'
    delete: '<bad>✖</bad> <text>Delete'
    icon: '<accent>✦</accent> <text>Set Icon'
    icon-tooltip: '<muted>Use the item in your hand as this home''s icon'
    icon-clear: '<muted>✖</muted> <text>Clear Icon'
    new-title: '<good>+</good> <text><b>New Home'
    new-body: '<muted>Saves where you''re standing</muted> <dim>(<coords>)'
    name-label: '<muted>Name'
    save: '<good><b>✔ Save'
    name-taken: '<bad>You already have a home called <name>.'
    rename-title: '<warn>✎</warn> <text><b>Rename <name>'
    delete-title: '<bad>✖</bad> <text><b>Delete Home?'
    delete-body: '<muted>Delete</muted> <text><name></text><muted>? This can''t be undone.'
    delete-confirm: '<bad><b>Delete'
    delete-keep: '<muted>Keep It'
    move-title: '<accent>⤓</accent> <text><b>Move Home?'
    move-body: '<muted>Move</muted> <text><name></text> <muted>to where you''re standing</muted> <dim>(<coords>)</dim><muted>? Its old spot is forgotten.'
    move-confirm: '<accent><b>Move It'
    move-keep: '<muted>Keep It'

  nick:
    title: '<warn>✎</warn> <text><b>Nickname'
    current: '<muted>Right now you''re</muted> <nick> <dim>(<name>)'
    current-none: '<muted>No nickname yet - you''re</muted> <text><name></text><muted>.'
    input-label: '<muted>New nickname'
    tips-plain: '<dim>Letters, numbers and _ only. 3-16 characters.'
    tips-color:
      - '<dim>Letters, numbers and _ only. 3-16 characters.'
      - '<dim>Colors:</dim> <muted>&d</muted><#ff55ff>pink</#ff55ff><dim>, </dim><muted>&#ff9ad5</muted><#ff9ad5>hex</#ff9ad5><dim>, </dim><muted>&l</muted><b>bold</b>'
    tips-gradient:
      - '<dim>Letters, numbers and _ only. 3-16 characters.'
      - '<dim>Colors:</dim> <muted>&d</muted><#ff55ff>pink</#ff55ff><dim>, </dim><muted>&#ff9ad5</muted><#ff9ad5>hex</#ff9ad5><dim>, </dim><muted>&l</muted><b>bold</b>'
      - '<dim>Gradients:</dim> <muted>\<gradient:#ff9ad5:#9ad5ff>Name\</gradient></muted>'
      - '<dim>  → </dim><gradient:#ff9ad5:#9ad5ff>Name</gradient>   <muted>\<rainbow>Name\</rainbow></muted> <dim>→</dim> <rainbow>Name</rainbow>'
    preview: '<sky>◉</sky> <text>Preview'
    preview-tooltip: '<muted>See it before you commit'
    reset: '<bad>↺</bad> <text>Use My Real Name'
    reset-tooltip: '<muted>Remove your nickname'
    preview-title: '<warn>✎</warn> <text><b>Looking Good?'
    preview-body: '<muted>Your new name:</muted>  <nick>'
    preview-chat: '<dim>In chat:</dim>  <nick><dim>:</dim> <text>hello everyone!'
    apply: '<good><b>✔ Use It'
    edit: '<warn>✎</warn> <text>Edit'

  trails:
    title: '<warn>✺</warn> <text><b>Flight Trails'
    body: '<muted>Sparkles you leave behind while flying.</muted><newline><muted>Now:</muted> <current>'
    none: '<dim>off'
    selected: '<good>✔</good> <style>'
    locked: '<dim>🔒</dim> <style>'
    tooltip: '<muted>Use this trail</muted><newline><dim>/trail <id>'
    locked-tooltip: '<muted>Not unlocked yet'
    no-trail: '<muted>✕ No Trail'

gui:
  # The shared bottom row of the chest menus (/tpa, /pets, pickers, graves, /recipes, stalls): Previous, Back and
  # Next arrows, the way back to the main menu and Close. <page>/<pages> in page.
  nav:
    previous: '<text>← Previous Page'
    next: '<text>Next Page →'
    back: '<text>← Back'
    hub: '<gradient:#c3a6ff:#8fd3ff>Aftr Hrs Menu</gradient>'
    hub-lore: '<muted>Back to the main menu'
    close: '<bad>Close'
    page:
      - '<dim>Page <page> of <pages>'
  tpa:
    title: '<dark_gray>Teleport · <page>/<pages>'
    head-name: '<name>'
    head-realname: '<dim>(<name>)'
    head-world: '<muted>In</muted> <text><world>'
    head-waiting:
      - ''
      - '<warn>✦ Wants to teleport with you!</warn>'
      - '<good>Shift-click</good> <muted>to accept'
    head-actions:
      - ''
      - '<sky>Left-click</sky> <muted>· ask to go to them'
      - '<accent>Right-click</accent> <muted>· ask them to come here'
    head-actions-no-here:
      - ''
      - '<sky>Click</sky> <muted>· ask to go to them'
    head-toggled: '<bad>● Not taking requests right now'
    nobody: '<muted>Nobody else is online'
    nobody-lore: '<dim>It''s quiet... too quiet.'
    requests: '<warn>✦ <count> Waiting For You'
    requests-lore:
      - '<muted>Teleport requests you haven''t answered.'
      - '<good>Click</good> <muted>to answer them'
    toggle-on: '<good>● Requests On'
    toggle-off: '<bad>● Requests Off'
    toggle-lore:
      - '<muted>Allow or block incoming /tpa requests.'
      - '<sky>Click</sky> <muted>to switch'
  # The shared player-head picker (chest-lock allow lists). <name> is the player; <count> how many are chosen.
  picker:
    head-name: '<name>'
    offline: '<dim>Offline'
    chosen:
      - ''
      - '<good>✔ Chosen</good>'
      - '<sky>Click</sky> <muted>to remove'
    not-chosen:
      - ''
      - '<sky>Click</sky> <muted>to add'
    nobody: '<muted>Nobody else to pick'
    nobody-lore: '<dim>Players show up here while they''re online.'
    count: '<good><count></good> <muted>chosen'

teleport:
  warmup: '<accent>✦</accent> <muted>Teleporting to</muted> <destination>  <bar>  <text><seconds>s</text> <dim>· don''t move'
  arrived: '<accent>✦</accent> <muted>Welcome to</muted> <destination>'
  cancelled: '<prefix><bad>Teleport canceled</bad> <muted>- <reason>.'
  cancelled-bar: '<bad>✖ Teleport canceled'
  reason-moved: 'you moved'
  reason-hurt: 'you got hurt'
  destination-gone: '<prefix><bad>That place isn''t there any more.'
  failed: '<prefix><bad>The teleport didn''t work. Try again?'
  unsafe: '<prefix><bad>No safe spot to land at</bad> <destination><muted>. Nothing is there to stand on, or it''s blocked, lava or fire.'

tpa:
  received:
    - ''
    - ' <gradient:#c3a6ff:#8fd3ff><b>✦ Teleport Request</b></gradient>'
    - ' <sender> <muted>wants to teleport</muted> <text>to you</text><muted>.'
    - ''
    - '   <accept>   <deny>   <dim>⌛ <seconds>s'
    - ''
  received-here:
    - ''
    - ' <gradient:#c3a6ff:#8fd3ff><b>✦ Teleport Request</b></gradient>'
    - ' <sender> <muted>wants you to teleport</muted> <text>to them</text><muted>.'
    - ''
    - '   <accept>   <deny>   <dim>⌛ <seconds>s'
    - ''
  button-accept:
    label: '<good><b>[✔ Accept]</b></good>'
    hover: '<good>Click to accept</good><newline><dim>or type /tpaccept'
  button-deny:
    label: '<bad><b>[✖ Deny]</b></bad>'
    hover: '<bad>Click to deny</bad><newline><dim>or type /tpdeny'
  button-cancel:
    label: '<dim>[</dim><muted>cancel</muted><dim>]</dim>'
    hover: '<muted>Take the request back'
  sent: '<prefix><muted>Request sent to</muted> <target><muted>. They have <seconds>s to answer.</muted> <cancel>'
  sent-here: '<prefix><muted>Asked</muted> <target> <muted>to come to you. They have <seconds>s to answer.</muted> <cancel>'
  accepted-target: '<prefix><good>Accepted!</good> <muted>Bringing</muted> <sender> <muted>together with you...'
  accepted-sender: '<prefix><target> <good>accepted</good> <muted>your request!'
  denied-target: '<prefix><muted>You declined</muted> <sender><muted>''s request.'
  denied-sender: '<prefix><target> <bad>declined</bad> <muted>your request.'
  expired-sender: '<prefix><muted>Your request to</muted> <target> <muted>expired.'
  expired-target: '<prefix><dim><sender>''s teleport request expired.'
  # Either side left (quit, kick or ban) while a request was waiting.
  target-left: '<prefix><target> <muted>left, so your teleport request was dropped.'
  sender-left: '<prefix><dim><sender> left; their teleport request is gone.'
