    unavailable-them: '<prefix><player> <muted>can''t trade right now, so the trade is off.'
    too-far: '<prefix><muted>You got too far apart, so the trade is off.'
    reload: '<prefix><muted>Feather was reloaded, so the trade is off.'
    stopped: '<prefix><muted>The server is stopping, so the trade is off.'
