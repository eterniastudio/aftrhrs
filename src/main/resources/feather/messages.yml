    stopped: '<prefix><muted>Stopped the chat game.'
    none: '<prefix><muted>No chat game is running.'
    reloaded: '<prefix><muted>Chat games reloaded:</muted> <text><trivia></text> <muted>trivia questions.'
    reset: '<prefix><muted>Cleared the chat game stats of</muted> <text><player></text><muted>.'

