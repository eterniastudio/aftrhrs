# Auth gate (modules.auth, docs/auth.md). Players see these before they've typed the server code.
auth:
  title: '<accent><b>Welcome to <server></b>'
  subtitle: '<text>Type the server code in chat'
  prompt: '<prefix><text>Type the <accent>server code</accent> in chat to start playing.</text> <muted>Only the server sees it.</muted> <dim>(<tries> tries · <time> left)'
  wrong: '<prefix><bad>That''s not the code.</bad> <muted><tries> tries left.'
  blocked-command: '<prefix><muted>Type the server code in chat first.'
  welcome: '<prefix><good>You''re in!</good> <text>Welcome to <server>,</text> <name><text>.</text> <muted>You won''t be asked again.'
  welcome-title: '<good><b>Welcome!</b>'
  welcome-subtitle: '<text>Have fun on <server>'
  kick-tries: |-
    <accent><b><server></b></accent>

    <text>That wasn't the right code.</text>
    <muted>Ask a friend on the server for it, then come back in <wait>.</muted>
  kick-timeout: |-
    <accent><b><server></b></accent>

    <text>You didn't type the server code in time.</text>
    <muted>Ask a friend on the server for it and join again.</muted>
  kick-cooldown: |-
    <accent><b><server></b></accent>

    <text>Too many wrong codes.</text>
    <muted>Please wait <wait> before joining again.</muted>
