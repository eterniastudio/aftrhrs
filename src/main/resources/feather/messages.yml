# Storage network + Quick Craft (docs/storage.md).
storage:
  items:
    terminal:
      name: '<sky>Storage Terminal'
      lore:
        - '<muted>Place it next to a chest, barrel or shulker box:'
        - '<muted>all the storage touching it shows up as one.'
        - '<dim>Right-click to open · Inventory Connectors reach further'
    crafting:
      name: '<accent>Crafting Terminal'
      lore:
        - '<muted>A Storage Terminal with a crafting grid:'
        - '<muted>craft straight from your storage.'
        - '<dim>Right-click to open'
    connector:
      name: '<good>Inventory Connector'
      lore:
        - '<muted>Joins any chest, barrel or shulker box touching it'
        - '<muted>to the network of a terminal nearby.'
        - '<dim>Connectors next to each other link up'
  place:
    placed-terminal: '<prefix><muted>Storage Terminal placed. It reaches</muted> <text><count></text> <muted>storage block(s). Right-click to open.'
