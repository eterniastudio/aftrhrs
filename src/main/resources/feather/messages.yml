# Chat games (docs/chat-games.md). <game> is the game's name below, <prompt> its question line, <reward> the coins.
chatgames:
  post:
    - '<prefix><accent>◆</accent> <text><b>Chat Game</b></text> <dim>·</dim> <game> <dim>·</dim> <muted>first right answer wins</muted><reward>'
    - '   <prompt> <dim>(<seconds>s)'
  reward: ' <coin><coins> ⛃</coin>'
  name:
    math: '<sky>Quick Math'
    trivia: '<warn>Trivia'
    unscramble: '<good>Unscramble'
    fast-type: '<bad>Fast Type'
    creature: '<accent>Guess the Creature'
    gaps: '<sky>Fill the Gaps'
  level:
    easy: '<good>easy'
    medium: '<warn>medium'
  prompt:
    math: '<text>What is</text> <warn><problem></warn><text>?</text> <dim>(</dim><level><dim>)'
    trivia: '<text><question>'
    unscramble: '<text>Unscramble</text> <warn><word></warn> <hint>'
    gaps: '<text>Fill in the gaps:</text> <warn><word></warn> <hint>'
    creature: '<text>Which creature am I?</text> <warn><clue></warn> <hint>'
    fast-type: '<text>Type this first:</text> <phrase>'
  # The hint after a word: <category> is one of categories below (keyed like words in chatgames.yml).
  category: '<dim>(<category>)'
  categories:
    creature: a creature
    relic: a relic
    item: an item
    biome: a biome
  home: '<dim>(found in: <home>)'
  won: '<prefix><good>✔</good> <name> <muted>got it in</muted> <text><time>s</text><muted>:</muted> <accent><answer></accent><reward>'
  won-reward: ' <dim>·</dim> <coin>+<coins> ⛃</coin>'
  streak: '<prefix><warn>✹</warn> <name> <muted>is on a</muted> <warn><streak>-win streak</warn><muted>!'
  timeout: '<prefix><muted>Time''s up! The answer was</muted> <accent><answer></accent><muted>.'
  timeout-phrase: '<prefix><muted>Time''s up! Nobody typed</muted> <accent><answer></accent> <muted>in time.'
  stopped: '<prefix><muted>That chat game was called off.'
  afk: '<prefix><muted>You were AFK, so that answer didn''t count. Welcome back!'
  starter: '<prefix><muted>You started this one with the answer, so you can''t win it.'
  too-fast: '<prefix><muted>That was quicker than anyone can type, so it doesn''t count.'
  capped: '<prefix><muted>You''ve won <cap> chat games this hour, give the others a go! Your next win can count in</muted> <text><time></text><muted>.'
  capped-win: '<prefix><muted>That''s <cap> wins this hour, so this one has no reward.'
  bond: '<prefix><accent><amount> bond XP</accent> <muted>for <count> pet(s) with you.'
  toggled-on: '<prefix><muted>Chat games</muted> <good>on</good><muted>.'
  toggled-off: '<prefix><muted>Chat games</muted> <bad>off</bad><muted>. You won''t see them or who won.'
  closed: '<prefix><bad>Chat games are paused:</bad> <muted>their data couldn''t be read. Please let a staff member know.'
  menu:
    title: '<accent>◆</accent> <text><b>Chat Games'
    you:
      - '<text>Your wins:</text> <accent><wins></accent> <dim>·</dim> <muted>this week</muted> <text><week></text>'
      - '<muted>Fastest</muted> <text><fastest></text> <dim>·</dim> <muted>streak</muted> <text><streak></text> <dim>(best <best>)'
    week-title: '<warn>★</warn> <text><b>This Week'
    all-title: '<warn>★</warn> <text><b>All Time'
    row: '<dim><rank>.</dim> <text><name></text> <muted><wins> wins</muted> <dim>· fastest <fastest>'
    row-you: '<dim><rank>.</dim> <accent><name></accent> <muted><wins> wins</muted> <dim>· fastest <fastest>'
    empty: '<dim>Nobody yet. Be the first!'
    how: '<muted>Now and then a game pops up in chat. The first right answer wins Goob Coins (up to <cap> rewarded wins an hour).'
    turn-off: '<good>●</good> <text>Chat Games</text> <dim>·</dim> <good>On'
    turn-on: '<bad>●</bad> <text>Chat Games</text> <dim>·</dim> <bad>Off'
    toggle-tooltip: '<text>Click to switch. Off: you don''t see the games or who won.'
  admin:
    usage: '<prefix><muted>/chatgames start [type] [--answer] [--time \<seconds>] · stop · reload · reset \<player>'
