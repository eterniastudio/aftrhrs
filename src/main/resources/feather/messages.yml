  tier-reached: '<prefix><sky>⌚</sky> <text><time> played today!</text> <muted>A reward is waiting.</muted> <button>'
  milestone-reached: '<prefix><accent>✦</accent> <text><time> played on the server!</text> <muted>A reward is waiting.</muted> <button>'
  playtime-claimed: '<prefix><good>✔ Claimed <count> playtime reward(s):</good> <reward>'
