# The login calendar (/calendar, Daily -> Calendar; docs/calendar.md). ⛃ = Goob Coins. <day> = the day of the
# 7-day cycle, <reward> = what it gives, <time> = a time or a countdown.
calendar:
  title: '<good>☀</good> <text><b>Calendar'
  streak: '<warn>✹</warn> <text><streak>-day streak</text> <dim>·</dim> <muted>best <best></muted> <dim>·</dim> <sky>☂ <grace></sky> <muted>grace day(s) left this week'
