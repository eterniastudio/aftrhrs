  # The 7-day row. <short> is the day's headline reward; hovering a day shows all of it.
  row:
    claimed: '<good>✔</good> <short>'
    today: '<warn>[★</warn> <short><warn>]</warn>'
    today-claimed: '<good>[✔</good> <short><good>]</good>'
    upcoming: '<dim>·</dim> <short>'
    big: '<accent>✦</accent> <short>'
    gap: '   '
    hover: '<text>Day <day></text><newline><reward>'
  reward:
    coins: '<coin><amount> ⛃</coin>'
    item: '<text><amount> <item>'
    bond: '<good>+<amount> pet bond'
    surprise: '<accent>a surprise'
    nothing: '<dim>nothing'
    separator: '<dim> · </dim>'
    short-item: '<text>▣'
    short-bond: '<good>❤'
    short-gift: '<accent>✉'
  today-ready: '<warn>★</warn> <text>Today, day <day>:</text> <reward>'
  today-claimed: '<good>✔</good> <muted>Claimed today, day <day>:</muted> <reward>'
