    gap: '<dim>  ·  </dim>'
  lifetime: '<accent>✦</accent> <muted>Lifetime</muted> <text><time></text> <dim>·</dim> <muted>next at</muted> <text><goal></text><muted>:</muted> <reward> <dim>(<left> to go)'
