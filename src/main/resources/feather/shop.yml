  # Dynamic prices: every unit sold today (server-wide, per item) lowers that item's price by drop-per-unit-percent,
  # down to floor-percent of the base. Prices recover fully at the daily reset (daily.reset-zone).
  dynamic:
    enabled: true
    drop-per-unit-percent: 0.5
    floor-percent: 40
  # Buttons shown per kind of item in the sell screen (the rest are still sold by Sell All).
  max-rows: 12

# Market stalls: staff set one up with /stall create <name> while looking at an arcana_market_stall_* furniture.
stalls:
  # Weekly rent, taken from the bank balance (renting and every renewal).
  rent: 50
  # Weeks a renter may pay ahead.
  max-weeks-ahead: 4
  # Stalls one player may rent at once.
  max-per-player: 1
  max-listings: 18
  # Highest price for one item on a stall.
  max-price: 100000
  # How close (blocks) a player must be to use a stall.
  distance: 6
  # Sales while the owner is offline are summed up in one letter at most this often.
  offline-note-minutes: 10
  # Who returned stock and sale letters come from.
  mail-from: Market Stall
  # Stall keepers: a villager at the stall that opens the buying screen (everyone else) and the selling screen (the
  # renter). Renting gives a Stall Keeper item (/stall keeper hands out a new one; older ones stop working).
  keeper:
    # The placement item: a plain material (not a spawn egg) and the item model it shows (empty = the material's own).
    item:
      material: paper
      model: minecraft:villager_spawn_egg
    # How far (blocks) from the registered stall the keeper may stand.
    distance: 4
    # A new keeper's look; the renter can change it in the selling screen (cosmetic only).
    # type: plains, desert, jungle, savanna, snow, swamp, taiga. profession: none, armorer, butcher, cartographer,
    # cleric, farmer, fisherman, fletcher, leatherworker, librarian, mason, nitwit, shepherd, toolsmith, weaponsmith.
    default-look:
      type: plains
      profession: none
    # A purchase in the buying screen of this many coins or more asks to confirm first (0 = never).
    confirm-above: 500
