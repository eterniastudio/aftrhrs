# Feather shop (modules.shop): the General Store (/shop), the fishmonger and grocer sell-back counters and the market
# stalls (/stall). Docs: docs/shop.md. /feather reload re-reads this file. Every coin comes out of or goes into the
# bank balance (bank.yml); data lives in data/shop.yml, every sale and stall move is logged in data/shop-log.txt.
#
# Items are Oraxen ids (looked up when used, so an item that doesn't exist yet is just not offered) or vanilla
# items written as minecraft:<id>.

# The General Store. Categories in this order; each item: id, price (coins for one bundle) and amount (items in
# one bundle, default 1). featured: false keeps an item out of the weekly featured picks.
store:
  # Most bundles one purchase may buy.
  max-bundles: 64
  categories:
    seeds:
      icon: arcana_seeds_tomato
      items:
        - {id: arcana_seeds_rice, price: 4, amount: 1}
        - {id: arcana_seeds_tomato, price: 4, amount: 1}
        - {id: arcana_seeds_grape, price: 4, amount: 1}
        - {id: arcana_seeds_pepper, price: 4, amount: 1}
        - {id: arcana_seeds_blueberry, price: 4, amount: 1}
        - {id: arcana_seeds_tea, price: 4, amount: 1}
        - {id: arcana_seeds_corn, price: 4, amount: 1}
        - {id: arcana_seeds_weed, price: 4, amount: 1}
        - {id: arcana_seaweed_spores, price: 4, amount: 1}
    bait-rods:
      icon: arcana_driftwood_rod
      items:
        - {id: arcana_worm_bait, price: 5, amount: 8}
        - {id: arcana_grub_bait, price: 8, amount: 8}
        - {id: arcana_shrimp_bait, price: 10, amount: 8}
        - {id: arcana_glow_bait, price: 14, amount: 8}
        - {id: arcana_driftwood_rod, price: 40, amount: 1}
        - {id: arcana_coral_rod, price: 120, amount: 1}
    farming:
      icon: arcana_watering_can_tool
      items:
        - {id: arcana_compost, price: 6, amount: 8}
        - {id: arcana_watering_can_tool, price: 25, amount: 1}
        - {id: arcana_rolling_paper, price: 3, amount: 8}
    cosmetics:
      icon: arcana_string_lights
      items:
        - {id: arcana_string_lights, price: 12, amount: 1}
        - {id: arcana_beach_towel_red, price: 15, amount: 1}
        - {id: arcana_beach_towel_yellow, price: 15, amount: 1}
        - {id: arcana_beach_towel_blue, price: 15, amount: 1}
        - {id: arcana_sandcastle, price: 20, amount: 1}
        - {id: arcana_shell_wind_chime, price: 18, amount: 1}
  # Each Monday (daily.reset-zone in config.yml) this many items are picked at random and sold at a discount.
  featured:
    count: 3
    discount-percent: 25

# Selling back at the counters: right-click an arcana_shop_counter_fishmonger (fish, shellfish),
# arcana_shop_counter_grocer (crops, meals, grocer-goods) or arcana_shop_counter_miner (the mining list below), or
# /shop sell within counter-distance blocks of one. arcana_shop_counter_general opens the General Store.
# Counter keepers (the keeper_general / _fishmonger / _grocer / _miner items) are shopkeepers anyone can place where
# they may build: right-clicking one does what its counter does (a sale needs you within counter-distance of it).
# Sneak + right-click picks one up again (whoever placed it, or feather.shop.admin).
sell:
  counter-distance: 6
  # Coins for one item, before the quality / rarity multiplier and the daily price drop.
  fish:
    common: 2
    uncommon: 6
    rare: 18
    legendary: 80
  shellfish: 3
  crop: 1
  meal: 6
  crop-quality:
