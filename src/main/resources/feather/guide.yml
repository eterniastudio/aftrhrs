# Arcana taming guide, generated by MythicMobs/packs/Arcana/tools/gen_guide.py (edit that, not this file).
# "menu" and "creatures" drive the /tamingguide menu (Paper dialogs with creature previews from the
# Oraxen glyphs in Oraxen/glyphs/arcana_guide.yml). "pages" is the old book, still at /tamingguide book.
# MiniMessage everywhere (https://docs.advntr.dev/minimessage/format). After editing run /feather reload.
title: "<dark_purple>Arcana Taming Guide"
author: "Arcana"
menu:
  how-to:
    - "<text>Hold a creature's <good>tame item</good> and right-click it."
    - "<good>❤ Hearts</good> <muted>means it's yours.</muted>  <dim>☁ Smoke</dim> <muted>means try again."
    - ""
    - "<muted>Feed it its heal item to heal it, right-click with an empty hand to pet it,"
    - "<muted>and Shift + right-click to make it stay or follow. A renamed Name Tag names it."
  pet-care:
    - "<text>Bond levels 0–5</text> <muted>grow as your pet follows you, eats and helps."
    - "<muted>A higher bond makes its job stronger."
    - ""
    - "<accent>/pets</accent> <muted>calls, renames, releases and revives your pets.</muted>"
    - "<muted>Up to 6 pets (mounts count). Fallen pets come back with their plushie."
  groups:
    - id: companions
      name: "Companions"
      icon: guide_icon_mossbun
      blurb: "Small helpers that follow you everywhere."
      creatures: [ArcanaEmberkit, ArcanaSnowpeltOwlet, ArcanaCairnling, ArcanaGlimmermoth, ArcanaRunebackTortoise, ArcanaSkyfinRay, ArcanaMossbun, ArcanaBurrowpip, ArcanaHoneycub, ArcanaPuddlepup, ArcanaWickling, ArcanaCloudlamb, ArcanaMagpip, ArcanaCanopip, ArcanaSporeling, ArcanaBarkling, ArcanaHushwing, ArcanaShellpip, ArcanaRipplekit, ArcanaBubblefin, ArcanaDriftglow, ArcanaChorusling, ArcanaShulkling, ArcanaSoulmander, ArcanaFumetail, ArcanaFloepup, ArcanaPockie, ArcanaEmperorPenguin, ArcanaRockhopperPenguin, ArcanaFrogGuy]
    - id: dogs-cats
      name: "Dogs & Cats"
      icon: guide_icon_golden_retriever
      blurb: "Every dog and cat wears a rune tag and has a job."
      creatures: [ArcanaHusky, ArcanaHuskyCopper, ArcanaGoldenRetriever, ArcanaSaintBernard, ArcanaBeagle, ArcanaCorgi, ArcanaDachshund, ArcanaMaineCoon, ArcanaTabbyCat, ArcanaBlackCat, ArcanaCalicoKitten, ArcanaLuna, ArcanaKevin, ArcanaKitty, ArcanaClover, ArcanaLunaTwo, ArcanaOlive, ArcanaOzzy]
    - id: mounts
      name: "Mounts"
      icon: guide_icon_dunebun
      blurb: "Ride them, two at a time. Flyers go up with Space, down with Shift."
      creatures: [ArcanaDunebun, ArcanaSnowmuff, ArcanaCinderwingMount, ArcanaTempestRocMount, ArcanaTidemane]
    - id: wild
      name: "Wild Ones"
      icon: guide_icon_cinder_imp
      blurb: "They attack you in the wild. Tamed, they guard you instead."
      creatures: [ArcanaCinderImp, ArcanaRimeWraith, ArcanaVoltWisp, ArcanaGeodeCrawler]
