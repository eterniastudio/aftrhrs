pages:
- "<dark_purple><bold>Arcana\nTaming Guide</bold></dark_purple>\n\nHold a creature's\n<dark_green>tame item</dark_green> and\nright-click it.\n\n<dark_red>Hearts</dark_red>: tamed!\n<dark_gray>Smoke</dark_gray>: try again.\n\nEvery companion\nhas a job. Turn\nthe page!"
- "<dark_purple><bold>Your companion</bold></dark_purple>\n\n<dark_green>Food</dark_green>: heals it.\n<dark_green>Empty hand</dark_green>: pet it.\n<dark_green>Shift + right-click</dark_green>\nstay / follow. It\nnaps at night.\n<dark_green>Name Tag</dark_green> (renamed\nat an anvil): names\nit.\n\nFar away? It comes\nto you."
- "<dark_purple><bold>Pet care</bold></dark_purple>\n\n<dark_green>Bond</dark_green> 0-5: grows as\nit follows, eats,\nand helps. Higher\nbond = a stronger\njob.\n<dark_green>/pets</dark_green>: summon,\nrename, release,\nrevive. Up to 6\npets (mounts too).\n<dark_green>Fallen?</dark_green> Use its\nplushie to revive."
- "<gold><bold>Emberkit</bold></gold>\n<dark_gray>Deserts, savannas,\nbadlands</dark_gray>\n<dark_green>Tame:</dark_green> Blaze Powder\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Sweet Berries\n\nBites set foes on\nfire. Lights unlit\ncampfires near it.\n<dark_gray>Bond: wider, hotter</dark_gray>"
- "<dark_aqua><bold>Snowpelt Owlet</bold></dark_aqua>\n<dark_gray>Snowy biomes</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Cod\n\nPecks slow foes.\nAt night it hoots\nand makes nearby\nmonsters glow.\n<dark_gray>Bond: wider watch</dark_gray>"
- "<dark_gray><bold>Cairnling</bold></dark_gray>\n<dark_gray>Caves, stony\nshores, peaks</dark_gray>\n<dark_green>Tame:</dark_green> Lapis Lazuli\n<dark_gray>1 in 4</dark_gray>\n<dark_green>Heal:</dark_green> Amethyst Shard\n\nGives you\nResistance, and\nHaste while you\nare underground.\n<dark_gray>Bond: Haste II</dark_gray>"
- "<light_purple><bold>Glimmermoth</bold></light_purple>\n<dark_gray>Flower forests,\nmeadows</dark_gray>\n<dark_green>Tame:</dark_green> Glow Berries\n<dark_gray>1 in 2</dark_gray>\n<dark_green>Heal:</dark_green> Glow Berries\n\nNight Vision after\ndark. By day it\nspreads flowers\non grass.\n<dark_gray>Bond: more blooms</dark_gray>"
- "<dark_green><bold>Runeback\nTortoise</bold></dark_green>\n<dark_gray>Rivers, swamps,\nbeaches</dark_gray>\n<dark_green>Tame:</dark_green> Seagrass\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Dried Kelp\n\nWater Breathing\nin water. Shields\nyou with Absorption\nwhen you are hurt.\n<dark_gray>Bond: shield sooner</dark_gray>"
- "<dark_blue><bold>Skyfin Ray</bold></dark_blue>\n<dark_gray>Mountain peaks</dark_gray>\n<dark_green>Tame:</dark_green> Phantom Membrane\n<dark_gray>1 in 4</dark_gray>\n<dark_green>Heal:</dark_green> Tropical Fish\n\nSlow Falling and\nSpeed outdoors.\nPushes you along\nwhile you glide.\n<dark_gray>Bond: stronger push</dark_gray>"
- "<dark_green><bold>Mossbun</bold></dark_green>\n<dark_gray>Meadows, flower\nforests, lush caves</dark_gray>\n<dark_green>Tame:</dark_green> Moss Block\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Carrot\n\nThe gardener.\nBonemeals crops\nand saplings\naround you.\n<dark_gray>Bond: wider garden</dark_gray>"
- "<dark_gray><bold>Burrowpip</bold></dark_gray>\n<dark_gray>Plains, meadows,\ndripstone caves</dark_gray>\n<dark_green>Tame:</dark_green> Brown Mushroom\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Beetroot\n\nThe forager.\nDigs up flint,\nnuggets and the odd\ngem now and then.\n<dark_gray>Bond: digs sooner</dark_gray>"
- "<gold><bold>Honeycub</bold></gold>\n<dark_gray>Flower and birch\nforests</dark_gray>\n<dark_green>Tame:</dark_green> Honey Bottle\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Sweet Berries\n\nFeeds you honey\nwhen you are\nhungry. A hug heals\nyou when low.\n<dark_gray>Bond: bigger snacks</dark_gray>"
- "<dark_aqua><bold>Puddlepup</bold></dark_aqua>\n<dark_gray>Rivers, swamps,\nlush caves</dark_gray>\n<dark_green>Tame:</dark_green> Salmon\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Salmon\n\nPuts you out when\nyou burn, douses\nfires around you.\nSwims you faster.\n<dark_gray>Bond: wider watch</dark_gray>"
- "<gold><bold>Wickling</bold></gold>\n<dark_gray>Caves and the\ndark underground</dark_gray>\n<dark_green>Tame:</dark_green> Glowstone Dust\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Honeycomb\n\nThe lantern. Lights\nup caves and nights\nso no monsters\nspawn near it.\n<dark_gray>Bond: brighter</dark_gray>"
- "<dark_aqua><bold>Cloudlamb</bold></dark_aqua>\n<dark_gray>Meadows, windswept\nhills, cherry groves</dark_gray>\n<dark_green>Tame:</dark_green> Wheat\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Wheat\n\nJump Boost. Catches\nyou when you fall\nfast. Sheds wool\nnow and then.\n<dark_gray>Bond: higher jumps</dark_gray>"
- "<dark_blue><bold>Magpip</bold></dark_blue>\n<dark_gray>Plains, forests,\nsavannas</dark_gray>\n<dark_green>Tame:</dark_green> Gold Nugget\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Wheat Seeds\n\nThe fetcher.\nBrings dropped\nitems nearby\nback to you.\n<dark_gray>Bond: wider fetch</dark_gray>"
- "<dark_green><bold>Canopip</bold></dark_green>\n<dark_gray>Jungles, bamboo\njungles</dark_gray>\n<dark_green>Tame:</dark_green> Melon Slice\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Apple\n\nThe farmhand.\nReplants what you\nharvest, finds\nseeds. Monkey\nbusiness included.\n<dark_gray>Bond: more seeds</dark_gray>"
- "<red><bold>Sporeling</bold></red>\n<dark_gray>Mushroom fields,\nfungal caves</dark_gray>\n<dark_green>Tame:</dark_green> Brown Mushroom\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Red Mushroom\n\nCrops near it come\nout finer. Puffs\nspores over them\nso you can see.\n<dark_gray>Bond: wider spores</dark_gray>"
- "<dark_gray><bold>Barkling</bold></dark_gray>\n<dark_gray>Pale gardens</dark_gray>\n<dark_green>Tame:</dark_green> Pale Oak Sapling\n<dark_gray>1 in 4</dark_gray>\n<dark_green>Heal:</dark_green> Bone Meal\n\nThe guard. Roots\nand strikes night\nmonsters near its\nspot; roots what\nhits you.\n<dark_gray>Bond: harder roots</dark_gray>"
- "<dark_aqua><bold>Hushwing</bold></dark_aqua>\n<dark_gray>The deep dark</dark_gray>\n<dark_green>Tame:</dark_green> Sculk Vein\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Glow Lichen\n\nYour steps don't\nwake sculk sensors\nor shriekers while\nit follows you.\n<dark_gray>Bond: no Darkness</dark_gray>"
- "<gold><bold>Shellpip</bold></gold>\n<dark_gray>Beaches, stony\nshores</dark_gray>\n<dark_green>Tame:</dark_green> Seashell\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Dried Kelp\n\nBeachcomber. Digs\nup sea glass,\nshells and drift-\nwood on sand.\n<dark_gray>Bond: digs sooner</dark_gray>"
- "<dark_aqua><bold>Ripplekit</bold></dark_aqua>\n<dark_gray>Rivers, cold\noceans</dark_gray>\n<dark_green>Tame:</dark_green> Salmon\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Cod\n\nFishing partner.\nFaster bites,\nheavier rare fish.\nCracks clams for\npearls.\n<dark_gray>Bond: swims faster</dark_gray>"
- "<aqua><bold>Bubblefin</bold></aqua>\n<dark_gray>Warm and lukewarm\noceans</dark_gray>\n<dark_green>Tame:</dark_green> Tropical Fish\n<dark_gray>1 in 4</dark_gray>\n<dark_green>Heal:</dark_green> Seagrass\n\nConduit Power and\nDolphin's Grace\nwhile you swim\nnear it.\n<dark_gray>Bond: lasts longer</dark_gray>"
- "<light_purple><bold>Driftglow</bold></light_purple>\n<dark_gray>Deep oceans at\nnight</dark_gray>\n<dark_green>Tame:</dark_green> Glow Berries\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Glow Ink Sac\n\nA real light under\nwater, wherever it\nis. Stings drowned\nand guardians.\n<dark_gray>Bond: brighter</dark_gray>"
- "<light_purple><bold>Chorusling</bold></light_purple>\n<dark_gray>The End: chorus\nhighlands, wilds</dark_gray>\n<dark_green>Tame:</dark_green> Chorus Fruit\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Popped Chorus\nFruit\n\nFall into the void\nand it pulls you\nback to solid\nground.\n<dark_gray>Bond: rescues sooner</dark_gray>"
- "<dark_purple><bold>Shulkling</bold></dark_purple>\n<dark_gray>The End: highlands,\nfrost, hallow</dark_gray>\n<dark_green>Tame:</dark_green> Ender Pearl\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Chorus Fruit\n\nEndermen stay calm\nwith you. Shulker\nlevitation turns\ninto a slow float.\n<dark_gray>Bond: wider calm</dark_gray>"
- "<dark_aqua><bold>Soulmander</bold></dark_aqua>\n<dark_gray>Soul sand valleys\n(Nether)</dark_gray>\n<dark_green>Tame:</dark_green> Ghast Tear\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Bone\n\nBurns the Wither\noff you. Speed on\nsoul sand and\nsoul soil.\n<dark_gray>Bond: wards sooner</dark_gray>"
- "<dark_aqua><bold>Fumetail</bold></dark_aqua>\n<dark_gray>Warped forests\n(Nether)</dark_gray>\n<dark_green>Tame:</dark_green> Warped Fungus\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Warped Roots\n\nHoglins near you\ncalm down and back\noff. Sprays monsters\nthat hit you.\n<dark_gray>Bond: wider musk</dark_gray>"
- "<gray><bold>Floepup</bold></gray>\n<dark_gray>Oceans, cold and\nfrozen oceans</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Salmon\n\nLifeguard. Out of\nair or badly hurt\nunder water? It\nbrings you air and\nheals you.\n<dark_gray>Bond: rescues sooner</dark_gray>"
- "<dark_aqua><bold>Pockie</bold></dark_aqua>\n<dark_gray>Warm and lukewarm\noceans</dark_gray>\n<dark_green>Tame:</dark_green> Sea Pickle\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Dried Kelp\n\nA pocket shark that\nglows in the dark.\nMarks monsters and\nfish near you. On\nland it rolls along\nin its fishbowl.\n<dark_gray>Bond: wider glow</dark_gray>"
- "<gold><bold>Emperor Penguin</bold></gold>
<dark_gray>Snowy beaches,
frozen oceans</dark_gray>
<dark_green>Tame:</dark_green> raise a chick
<dark_gray>fish, 1 in 3</dark_gray>
<dark_green>Heal:</dark_green> Raw fish

Rides in your boat:
+40% speed, a sled
on snow. Fed a fish
it fishes with you.
<dark_gray>Bond: faster boat</dark_gray>"
- "<yellow><bold>Rockhopper</bold></yellow>
<dark_gray>Stony shores,
cold beaches</dark_gray>
<dark_green>Tame:</dark_green> raise a chick
<dark_gray>fish, 1 in 3</dark_gray>
<dark_green>Heal:</dark_green> Raw fish

Rides in your boat:
+30% speed, a sled
on snow. The best
fishing buddy.
<dark_gray>Bond: luckier fishing</dark_gray>"
- "<aqua><bold>Raising a chick</bold></aqua>

Penguin chicks live
in the colonies. A
raw fish may win
one over. Each fish
keeps it growing
for 5 minutes; after
20 fed minutes it
grows up, still
yours."
- "<dark_purple><bold>Dogs and cats</bold></dark_purple>\n\nEvery dog and cat\nwears a rune tag\nand has a job.\n\nThey get sleepy at\nnight, beg for\ntreats, shiver in\nthe snow and zoom\nwhen they're happy."
- "<aqua><bold>Husky</bold></aqua>\n<dark_gray>Snowy taiga,\nsnowy plains</dark_gray>\n<dark_green>Tame:</dark_green> Rabbit\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Salmon\n\nSnow sled dog.\nSpeed when you\nsprint, more on\nsnow. No freezing.\n<dark_gray>Bond: faster sled</dark_gray>"
- "<gold><bold>Copper Husky</bold></gold>\n<dark_gray>Taiga, windswept\nforests</dark_gray>\n<dark_green>Tame:</dark_green> Rabbit\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Salmon\n\nTrail dog. Speed\nwhen you sprint;\nsprinting with it\nbarely costs food.\n<dark_gray>Bond: more stamina</dark_gray>"
- "<gold><bold>Golden\nRetriever</bold></gold>\n<dark_gray>Forests, rivers</dark_gray>\n<dark_green>Tame:</dark_green> Chicken\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Chicken\n\nBrings your arrows\nand tridents back.\nSwims you faster.\n<dark_gray>Bond: wider fetch</dark_gray>"
- "<gold><bold>Saint Bernard</bold></gold>\n<dark_gray>Snowy slopes,\npeaks (rare)</dark_gray>\n<dark_green>Tame:</dark_green> Cooked Mutton\n<dark_gray>1 in 4</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Beef\n\nRescuer. Heals and\nthaws you when you\nare in trouble.\n<dark_gray>Bond: rescue sooner</dark_gray>"
- "<dark_green><bold>Beagle</bold></dark_green>\n<dark_gray>Plains, forests,\nvillages</dark_gray>\n<dark_green>Tame:</dark_green> Bone\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Rabbit\n\nScent hound. Makes\nfarm animals near\nyou glow.\n<dark_gray>Bond: wider nose</dark_gray>"
- "<dark_aqua><bold>Corgi</bold></dark_aqua>\n<dark_gray>Meadows, plains,\nvillages</dark_gray>\n<dark_green>Tame:</dark_green> Cooked Beef\n<dark_gray>1 in 4</dark_gray>\n<dark_green>Heal:</dark_green> Cookie\n\nHerder. Sneak and\nit herds farm\nanimals to you.\n<dark_gray>Bond: wider herding</dark_gray>"
- "<gold><bold>Dachshund</bold></gold>\n<dark_gray>Plains, savannas,\nvillages</dark_gray>\n<dark_green>Tame:</dark_green> Cooked Porkchop\n<dark_gray>1 in 4</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Chicken\n\nHunts silverfish\nand pests. Sniffs\nout chests.\n<dark_gray>Bond: sharper nose</dark_gray>"
- "<dark_purple><bold>Maine Coon</bold></dark_purple>\n<dark_gray>Taiga, villages</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 4</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Salmon\n\nNight warden.\nRepels phantoms,\nhisses at monsters.\n<dark_gray>Bond: wider ward</dark_gray>"
- "<gold><bold>Tabby Cat</bold></gold>\n<dark_gray>Plains, forests,\nvillages</dark_gray>\n<dark_green>Tame:</dark_green> Salmon\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Salmon\n\nCreepers keep\ntheir distance\nfrom you.\n<dark_gray>Bond: wider ward</dark_gray>"
- "<dark_purple><bold>Black Cat</bold></dark_purple>\n<dark_gray>Swamps, dark\nforests</dark_gray>\n<dark_green>Tame:</dark_green> Tropical Fish\n<dark_gray>1 in 4</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Cod\n\nLuck II. Leaves\nyou a gift in the\nmorning.\n<dark_gray>Bond: Luck III</dark_gray>"
- "<light_purple><bold>Calico Kitten</bold></light_purple>\n<dark_gray>Plains, villages</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Cod\n\nPurrs you back to\nhealth when you are\nhurt. Crouch by it\nfor more.\n<dark_gray>Bond: longer purrs</dark_gray>"
- "<aqua><bold>Luna</bold></aqua>\n<dark_gray>Not in the wild:\nspawn egg only</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Cod\n\nFluffy moon cat.\nNight Vision for\nyou after dark.\nArrives named Luna.\n<dark_gray>Bond: lasts longer</dark_gray>"
- "<gold><bold>Kevin</bold></gold>\n<dark_gray>Not in the wild:\nspawn egg only</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Cod\n\nChonky paw-fisher.\nScoops fish out of\nwater for you.\nArrives named Kevin.\n<dark_gray>Bond: fishes sooner</dark_gray>"
- "<dark_green><bold>Kitty</bold></dark_green>\n<dark_gray>Not in the wild:\nspawn egg only</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Salmon\n\nFluffy Maine Coon\nbed buddy. Sleeps on\nyour bed; you wake\nup well rested.\nArrives named Kitty.\n<dark_gray>Bond: rests you longer</dark_gray>"
- "<green><bold>Clover</bold></green>\n<dark_gray>Not in the wild:\nspawn egg only</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Cod\n\nLucky tuxedo cat.\nDigs up lucky finds\nand bats them over\nto you, with Luck.\nArrives named Clover.\n<dark_gray>Bond: rarer finds</dark_gray>"
- "<light_purple><bold>Luna But The\nSecond One</bold></light_purple>\n<dark_gray>Not in the wild:\nspawn egg only</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Cod\n\nGrumpy grey tabby\nin a Christmas hat.\nHer glare weakens\nand slows monsters.\n<dark_gray>Bond: longer glare</dark_gray>"
- "<gold><bold>Olive</bold></gold>\n<dark_gray>Not in the wild:\nspawn egg only</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Salmon\n\nDerpy orange tabby.\nHurt? He flops over\nbeside you and purrs:\nRegeneration.\nArrives named Olive.\n<dark_gray>Bond: longer purrs</dark_gray>"
- "<dark_gray><bold>Ozzy</bold></dark_gray>\n<dark_gray>Not in the wild:\nspawn egg only</dark_gray>\n<dark_green>Tame:</dark_green> Cod\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Cooked Cod\n\nVery fat black cat.\nPounces on monsters\nnear you. Attacks\nyour ankles anyway.\nArrives named Ozzy.\n<dark_gray>Bond: harder bites</dark_gray>"
- "<green><bold>Frog Guy</bold></green>\n<dark_gray>Not in the wild:\nspawn egg only</dark_gray>\n<dark_green>Tame:</dark_green> Slime Ball\n<dark_gray>1 in 3</dark_gray>\n<dark_green>Heal:</dark_green> Sweet Berries\n\nStumpy, aloof frog\nscout in a sash.\nJump Boost while\nhe follows you.\nArrives named Frog Guy.\n<dark_gray>Bond: Jump Boost II</dark_gray>"
- "<dark_purple><bold>Mounts</bold></dark_purple>\n\nRight-click your\nmount (not holding\nits food) to ride.\n\nA friend can\nright-click it to\nhop on behind you.\n\n<dark_green>Walkers</dark_green>: WASD,\nSpace jumps.\n<dark_green>Flyers</dark_green>: Space up,\nShift down."
- "<gold><bold>Dunebun</bold></gold> <dark_gray>mount</dark_gray>\n<dark_gray>Meadows, plains\n(rare)</dark_gray>\n<dark_green>Tame:</dark_green> Golden Carrot\n<dark_gray>1 in 6</dark_gray>\n<dark_green>Heal:</dark_green> Carrot\n\nHopping mount for\ntwo. Huge jumps,\nno fall damage.\n<dark_gray>Bond: higher hops</dark_gray>"
- "<dark_aqua><bold>Snowmuff</bold></dark_aqua> <dark_gray>mount</dark_gray>\n<dark_gray>Snowy plains,\ntaiga (rare)</dark_gray>\n<dark_green>Tame:</dark_green> Pumpkin Pie\n<dark_gray>1 in 6</dark_gray>\n<dark_green>Heal:</dark_green> Hay Block\n\nMount for two.\nFreezes water as\nit walks. Keeps\nyou warm.\n<dark_gray>Bond: wider ice</dark_gray>"
- "<dark_red><bold>Cinderwing\nPhoenix</bold></dark_red> <dark_gray>mount</dark_gray>\n<dark_gray>Nether, badlands\n(rare)</dark_gray>\n<dark_green>Tame:</dark_green> Blaze Rod\n<dark_gray>1 in 8</dark_gray>\n<dark_green>Heal:</dark_green> Golden Carrot\n\nFlyer for two.\nFire Resistance.\nLeft-click to\nkindle a block.\n<dark_gray>Bond: longer guard</dark_gray>"
- "<dark_blue><bold>Tempest Roc</bold></dark_blue> <dark_gray>mount</dark_gray>\n<dark_gray>Windswept hills,\npeaks (rare)</dark_gray>\n<dark_green>Tame:</dark_green> Lightning Rod\n<dark_gray>1 in 8</dark_gray>\n<dark_green>Heal:</dark_green> Golden Carrot\n\nFlyer for two.\nSpeed. Dive and\nland for a gust\nthat clears mobs.\n<dark_gray>Bond: wider gust</dark_gray>"
- "<dark_aqua><bold>Tidemane</bold></dark_aqua> <dark_gray>mount</dark_gray>\n<dark_gray>Deep oceans\n(rare)</dark_gray>\n<dark_green>Tame:</dark_green> Dried Kelp Block\n<dark_gray>1 in 6</dark_gray>\n<dark_green>Heal:</dark_green> Kelp\n\nSwim mount for\ntwo. W swims where\nyou look. Water\nBreathing.\n<dark_gray>Bond: swims faster</dark_gray>"
- "<dark_red><bold>Wild ones</bold></dark_red>\n\nThese attack you\nin the wild.\n\nTamed, they guard\nyou instead and\nlearn a helpful\ntrick.\n\nBeat a bird boss:\nit leaves a mount!"
- "<red><bold>Cinder Imp</bold></red>\n<dark_gray>Deserts, Nether</dark_gray>\n<dark_green>Tame:</dark_green> Magma Cream\n<dark_gray>1 in 5</dark_gray>\n<dark_green>Heal:</dark_green> Blaze Powder\n\nTamed: puts out\nyour fires, gives\nFire Resistance.\n<dark_gray>Bond: wards sooner</dark_gray>"
- "<dark_aqua><bold>Rime Wraith</bold></dark_aqua>\n<dark_gray>Snowy biomes</dark_gray>\n<dark_green>Tame:</dark_green> Packed Ice\n<dark_gray>1 in 5</dark_gray>\n<dark_green>Heal:</dark_green> Snowball\n\nTamed: chills\nmonsters near you,\nFire Resistance\nnear lava.\n<dark_gray>Bond: wider chill</dark_gray>"
- "<gold><bold>Volt Wisp</bold></gold>\n<dark_gray>Plains, forests\nat night</dark_gray>\n<dark_green>Tame:</dark_green> Copper Ingot\n<dark_gray>1 in 5</dark_gray>\n<dark_green>Heal:</dark_green> Redstone\n\nTamed: charges you\nwith Haste + Speed,\nzaps monsters.\n<dark_gray>Bond: harder zaps</dark_gray>"
- "<dark_purple><bold>Geode Crawler</bold></dark_purple>\n<dark_gray>Caves, deep dark</dark_gray>\n<dark_green>Tame:</dark_green> Amethyst Cluster\n<dark_gray>1 in 4</dark_gray>\n<dark_green>Heal:</dark_green> Amethyst Shard\n\nTamed: chimes and\nsparkles at ores\nnear you.\n<dark_gray>Bond: wider pings</dark_gray>"
