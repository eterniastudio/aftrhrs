  no-room: "<bad>The generator needs two blocks of space."
  claim: "<bad>You can't do that here."
  placed-fan: "<muted>Encased Fan placed · needs a</muted> <text>Coal Generator</text> <muted>within 6 blocks"
  placed-generator: "<muted>Coal Generator placed · right-click to add coal"
  generator-title: "Coal Generator"
  generator-burning: "<#f0a35e>Burning · <load>/<capacity> power"
  generator-idle: "<muted>Idle · <load>/<capacity> power"
  generator-lore:
    - "<muted>Machines in range (<range> blocks):</muted> <text><machines>"
    - "<muted>Fuel left in this load:</muted> <text><seconds>s</text> <muted>at full load"
    - "<dim>Burns only while a machine draws power."
  fan-status: "<muted>Fan · <mode> · <power><process> ·</muted> <text><length></text> <muted>blocks"
  fan-push: "<text>Pushing"
  fan-pull: "<text>Pulling"
  fan-powered: "<good>Powered"
  fan-unpowered: "<bad>No power</bad> <dim>(needs a fueled generator within <range>)"
  process-wash: " · <aqua>Washing"
  process-smoke: " · <gray>Smoking"
  process-blast: " · <gold>Blasting"
  process-haunt: " · <dark_aqua>Haunting"
