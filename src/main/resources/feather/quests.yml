# Server goals: one runs each week, picked at random (by weight; the last three are skipped when possible).
#   type / target / target-name / amount / text: like a quest (amount is multiplied by server-goal.multiplier)
#   min-contribution: what a player must add to get the reward (default: min-contribution-percent of the goal)
#   reward: {coins, bond-xp} for each helper, claimed in /goal (default: server-goal.reward)
#   boosts: timed server-wide boosts when it's done. type quest-coins (quest coin rewards) or bond-xp (all pet bond
#           XP), multiplier, hours. Shown in the menus and on join while active.
#   commands: console commands run when it's done (<goal> = the goal id), e.g. to place a decoration at spawn.
#   unlocks: an extra line under "What it unlocks" (MiniMessage), e.g. for what the commands do.
goals:
  bosses:
    type: boss
    amount: 25
    reward: {coins: 200, bond-xp: 80}
    boosts:
      - {type: quest-coins, multiplier: 1.5, hours: 48}
    commands: []
  crops:
    type: harvest
    amount: 20000
    boosts:
      - {type: bond-xp, multiplier: 2.0, hours: 48}
  tames:
    type: tame
    amount: 60
    min-contribution: 1
    boosts:
      - {type: bond-xp, multiplier: 2.0, hours: 48}
  blocks:
    type: mine
    amount: 150000
    boosts:
      - {type: quest-coins, multiplier: 1.5, hours: 48}
  logs:
    type: fell
    amount: 20000
    boosts:
      - {type: quest-coins, multiplier: 1.5, hours: 24}
  fish:
    type: fish
    amount: 2000
    boosts:
      - {type: bond-xp, multiplier: 1.5, hours: 48}
  monsters:
    type: kill
    amount: 5000
    boosts:
      - {type: quest-coins, multiplier: 1.5, hours: 48}
  travellers:
    type: walk
    amount: 400000
    boosts:
      - {type: bond-xp, multiplier: 1.5, hours: 48}
  undead-cull:
    type: undead_cull
    amount: 600
    boosts:
      - {type: quest-coins, multiplier: 1.5, hours: 48}
