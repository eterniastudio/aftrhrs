# Feather quests (/quests) and the server goal (/goal), modules.quests. /feather reload re-reads this file.
# Full documentation: docs/quests.md. The day starts at 00:00 in config.yml daily.reset-zone, the week on Monday.
#
# Quest types:
#   tame     tame a creature (target: species, e.g. ArcanaCorgi)     codex   discover a new codex creature
#   bond     pet bond levels gained (target: species)                 harvest ripe crops, any tool (target: wheat, carrots ...)
#   scythe   ripe crops harvested with an Arcana scythe               mine    natural blocks mined (target: block id or #tag)
#   hammer   blocks mined with an Arcana hammer or excavator          fell    logs chopped with an Arcana lumber axe
#   boss     altar bosses defeated (target: boss type; party: N = only fights with at least N players)
#   fish     fish caught (target: item or Oraxen id, #rare / #rare+)  kill    hostile mobs defeated (target: entity id or #tag)
#   deposit  Goob Coins deposited at the bank (withdrawing takes it back)
#   visit    friends visited by teleport request (each friend counts once per quest)
#   walk     blocks walked                                            ride    blocks ridden on a mount (no boats or minecarts)
#   undead_cull  Arcana undead laid to rest (target: MythicMobs id, e.g. ArcanaMirewalker; needs the wildlife module)
#   chatgame chat games won (rewarded wins only; target: math, trivia, unscramble, fast-type, creature or gaps)
# Targets: an id (diamond_ore), a glob (*_log), a block/item/entity tag (#logs, #skeletons), or several with commas.
# Blocks anyone placed don't count for mining, each spot counts once a day, and nothing counts while a player is
# AFK, in creative or hasn't typed the server code.
#
# Each quest:  type, target (optional), target-name (what the menu calls the target), amount, difficulty
# (easy/medium/hard), weight (how often it's picked, default 1, 0 = never), rewards (coins, bond-xp; default: the
# rewards section by difficulty), text (optional: replaces the task line; <amount> and <target> work).

settings:
  daily:
    # One quest per entry, by difficulty, in this order.
    slots: [easy, medium, hard]
    # Free rerolls of an unfinished daily quest per day.
    rerolls: 1
  weekly:
    slots: [easy, medium, hard]
  # Blocks a player placed don't count for mining quests for this long (minutes).
  placed-block-minutes: 360
  # A crop spot counts again for harvest quests after this long (minutes), so a farm can be harvested as it regrows
  # but bone meal on one spot doesn't farm a quest.
  crop-spot-minutes: 20
  # Mining quests skip blocks softer than this (grass, flowers and torches break instantly). Dirt is 0.5, stone 1.5.
  mine-min-hardness: 0.3
  # Count hostile mobs from spawners (mob farms).
  count-spawner-mobs: false
  # A player needs this share of a boss fight's damage for the boss to count (the top damager always counts).
  boss-min-share: 0.03
  # "<sound key> [volume] [pitch]" or none.
  sounds:
    complete: entity.player.levelup 0.5 1.6
    claim: ui.toast.challenge_complete 0.6 1.3
    reroll: block.amethyst_block.chime 1.0 1.3

# Default rewards by difficulty. Coins go into the bank balance; bond XP goes to the pets following the player when
# they claim. Weekly quests pay more.
rewards:
  daily:
    easy: {coins: 10, bond-xp: 10}
    medium: {coins: 20, bond-xp: 20}
    hard: {coins: 35, bond-xp: 30}
  weekly:
    easy: {coins: 60, bond-xp: 50}
    medium: {coins: 110, bond-xp: 90}
    hard: {coins: 180, bond-xp: 140}

server-goal:
  enabled: true
  # Every goal's amount is multiplied by this (more players: raise it).
  multiplier: 1.0
  # Players who added at least this share of the goal (percent) get the reward, unless a goal sets min-contribution.
  min-contribution-percent: 1
  # Top helpers shown in /goal.
  top-shown: 5
  # The reward for each helper when a goal doesn't set its own.
  reward: {coins: 150, bond-xp: 60}
  # Goal size follows the player count: amount x multiplier x clamp(players active in the last active-days days /
  # reference, min, max), worked out when a goal starts. /goal rescale (staff) applies it again to the running goal.
  scaling:
    enabled: true
    reference: 10
    min: 0.15
    max: 3
    active-days: 7

