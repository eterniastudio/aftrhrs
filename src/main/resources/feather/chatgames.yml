# Words for Unscramble and Fill the Gaps, by category (the category is shown as a hint: chatgames.category.<name>
# in messages.yml). Two-word entries are scrambled word by word.
words:
  creature: [Mossbun, Emberkit, Cairnling, Glimmermoth, Burrowpip, Honeycub, Puddlepup, Wickling, Cloudlamb, Magpip,
             Husky, Beagle, Corgi, Dachshund, Dunebun, Snowmuff, Tortoise, Owlet, Maine Coon, Saint Bernard, Tabby Cat]
  relic: [Frostfang, Runebreaker, Cinderplume, Galeheart, Tidecaller, Witherbane, Dragonfire]
  item: [Diamond, Emerald, Netherite, Obsidian, Redstone, Lantern, Beacon, Elytra, Trident, Amethyst, Plushie, Spyglass,
         Lodestone, Composter, Honeycomb, Goob Coin]
  biome: [Badlands, Savanna, Meadow, Jungle, Taiga, Desert, Cherry Grove, Deep Dark, Ice Spikes, Lush Caves, Snowy Plains,
          Flower Forest, Mangrove Swamp]

# Fast Type: the first to type one of these exactly wins. Plain words only (no quotes or symbols) so everyone can
# type them. Each letter is sent as its own piece, so chat copy tools don't hand it over in one go.
phrases:
  - goob coins make the world go round
  - never dig straight down
  - the wickling keeps the dark away
  - my corgi herds better than me
  - shift f opens the menu
  - pet your pets every day
  - the tabby cat scares creepers
  - honeycub snacks are the best snacks
  - plushies bring your pets back
  - keep calm and tame a cloudlamb
  - who left the glimmermoth on
  - the magpip found my diamonds
  - see you aftr hrs
  - three cheers for the puddlepup
  - the dunebun hops over everything
  - feed the snowmuff some pumpkin pie
  - wukong dropped a peach
  - the mossbun ate my carrots
  - one more cookie for the corgi
  - the bank vault is not a piggy bank

# Guess the Creature: clues are built from guide.yml (each creature's job and where it lives, with its name hidden).
# Extra accepted answers per creature (its name in guide.yml is always accepted).
creature-aliases:
  ArcanaCinderwingMount: [Cinderwing, Phoenix]
  ArcanaTempestRocMount: [Roc]
  ArcanaSaintBernard: [St Bernard]
  ArcanaGoldenRetriever: [Retriever]
  ArcanaRunebackTortoise: [Runeback, Tortoise]
  ArcanaSnowpeltOwlet: [Owlet, Snowpelt]
  ArcanaSkyfinRay: [Skyfin]
  ArcanaTabbyCat: [Tabby]
  ArcanaCalicoKitten: [Calico]
# Creatures left out of Guess the Creature (MythicMobs ids).
creature-skip: []
