# Feather chat games (modules.chatgames): what the games ask. Timing, rewards and which games run: config.yml chatgames.
# Docs: docs/chat-games.md. /chatgames reload (or /feather reload) re-reads this file.
#
# Answers are forgiving: case, accents, punctuation and extra spaces don't matter, a leading "the"/"a"/"an" is ignored,
# spaces inside an answer are optional ("shiftf" = "shift f") and numbers can be written 1,000 or 1000.
# Fast Type is the exception: the phrase has to be typed exactly.

# Trivia: q is the question (MiniMessage, palette tags work), a the accepted answers; the first one is shown as the
# answer. Keep every answer correct for this server: the Aftr Hrs ones come from guide.yml, pets.yml, altars.yml,
# tools.yml, bank.yml and the Oraxen items. Change them here when that content changes.
